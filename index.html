<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>观己 · Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+SC:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg: #606060;
            --color-primary: #D8D0BE;
            --color-secondary: #B3A38D;
            --color-shadow: #916F56;
            --color-bg-deep: color-mix(in srgb, var(--color-bg) 72%, black);
            --mask-dark: color-mix(in srgb, black 20%, transparent);
            --label-tint: color-mix(in srgb, var(--color-secondary) 10%, transparent);
            --glow-soft: color-mix(in srgb, var(--color-secondary) 45%, transparent);
            --glow-mid: color-mix(in srgb, var(--color-secondary) 35%, transparent);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background: var(--color-bg);
            font-family: "Noto Serif SC", serif;
            letter-spacing: 0.1em;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .en, .tarot-en {
            font-family: "Cormorant Garamond", "Noto Serif SC", serif;
            letter-spacing: 0.05em;
        }

        .page-container {
            position: relative;
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
            min-height: 100vh;
            height: 100vh;
            max-height: 100vh;
            aspect-ratio: 9 / 19.5;
            background: var(--color-bg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            transition: background-color 1.2s ease, filter 1.2s ease;
        }

        .page-container.draw-dim {
            filter: brightness(0.45);
        }

        .page {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.75s ease, transform 0.75s ease, filter 0.75s ease;
        }

        .page.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .page.overflow-when-needed {
            overflow-y: auto;
        }

        .page.exit-shrink {
            opacity: 0;
            transform: scale(0.88);
            filter: blur(2px);
        }

        .page.exit-split-l {
            opacity: 0;
            transform: translateX(-18%);
        }

        .page.exit-split-r {
            opacity: 0;
            transform: translateX(18%);
        }

        .page.exit-split-both {
            opacity: 0;
            filter: blur(1px);
        }

        .page.exit-split-both .split-half-l {
            transform: translateX(-22%);
            opacity: 0;
            transition: transform 0.75s ease, opacity 0.75s ease;
        }

        .page.exit-split-both .split-half-r {
            transform: translateX(22%);
            opacity: 0;
            transition: transform 0.75s ease, opacity 0.75s ease;
        }

        .page.exit-fade {
            opacity: 0;
        }

        @keyframes smokeIn {
            from { opacity: 0; filter: blur(6px); }
            to { opacity: 1; filter: blur(0); }
        }

        .smoke-in {
            animation: smokeIn 1.5s ease-out forwards;
        }

        @keyframes waterRipple {
            from { opacity: 0; filter: blur(10px); }
            to { opacity: 1; filter: blur(0); }
        }

        .water-ripple {
            animation: waterRipple 1.4s ease-out forwards;
        }

        @keyframes revealChar {
            from {
                opacity: 0;
                transform: translateY(5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .reveal-char {
            display: inline-block;
            opacity: 0;
            animation: revealChar 0.22s ease forwards;
        }

        .reveal-char.space {
            width: 0.35em;
        }

        @keyframes ringBreath {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        .ring-start {
            position: absolute;
            left: 50%;
            bottom: 20%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            border: none;
            background: transparent;
            cursor: pointer;
            padding: 0;
            opacity: 0;
            transition: opacity 1.2s ease;
        }

        .ring-start.visible {
            opacity: 1;
        }

        .ring-outline {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 1.5px solid var(--color-secondary);
            pointer-events: none;
        }

        .ring-glow {
            position: absolute;
            inset: 10px;
            border-radius: 50%;
            background: radial-gradient(circle, color-mix(in srgb, var(--color-secondary) 55%, transparent) 0%, transparent 70%);
            animation: ringBreath 2.8s ease-in-out infinite;
            pointer-events: none;
        }

        .welcome-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            line-height: 2.5;
        }

        .welcome-title {
            font-size: 32px;
            font-weight: 400;
            color: var(--color-primary);
            letter-spacing: 0.2em;
            margin-bottom: 1.5rem;
        }

        .welcome-subtitle {
            font-size: 15px;
            font-weight: 400;
            color: var(--color-primary);
            letter-spacing: 0.18em;
            margin-top: 0.75rem;
        }

        .brand-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
        }

        .brand-title {
            font-size: 42px;
            font-weight: 300;
            color: var(--color-primary);
            letter-spacing: 0.25em;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .brand-title.show {
            opacity: 1;
        }

        .brand-line {
            margin-top: 30px;
            height: 0.5px;
            width: 0;
            max-width: 60px;
            background: var(--color-primary);
            transition: width 0.8s ease;
        }

        .brand-line.extend {
            width: 60px;
        }

        .brand-def {
            margin-top: 28px;
            font-size: 15px;
            color: var(--color-primary);
            letter-spacing: 0.12em;
            text-align: center;
            max-width: 88%;
            opacity: 0;
            transition: opacity 0.9s ease;
        }

        .brand-def.show {
            opacity: 1;
        }

        .brand-footer {
            position: absolute;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 9pt;
            color: var(--color-primary);
            opacity: 0.75;
            letter-spacing: 0.15em;
        }

        .btn-flat {
            min-width: 120px;
            height: 44px;
            border: 1.5px solid var(--color-secondary);
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            color: var(--color-secondary);
            font-family: inherit;
            letter-spacing: 0.1em;
            transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
        }

        .btn-flat:hover {
            box-shadow: 0 2px 10px var(--glow-mid);
        }

        .btn-flat:active {
            border-color: var(--color-primary);
            transform: scale(0.98);
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 28px;
            height: 28px;
            border: none;
            background: transparent;
            cursor: pointer;
            padding: 0;
            z-index: 5;
        }

        .back-btn svg {
            width: 100%;
            height: 100%;
            stroke: var(--color-secondary);
            stroke-width: 1.2px;
            fill: none;
        }

        .direction-card {
            width: 85%;
            padding: 18px 16px;
            border: 1px solid color-mix(in srgb, var(--color-primary) 60%, transparent);
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.3s;
        }

        .direction-card:active {
            transform: scale(0.97);
            border-color: var(--color-secondary);
        }

        .direction-card.selected {
            border-color: var(--color-secondary);
            box-shadow: 0 4px 14px color-mix(in srgb, var(--color-shadow) 45%, transparent);
        }

        .direction-card.selected:not(:active) {
            transform: scale(1.05);
            opacity: 0.95;
        }

        .direction-card .card-label {
            font-size: 20px;
            letter-spacing: 0.15em;
            color: var(--color-primary);
            opacity: 0.6;
            transition: color 0.3s, opacity 0.3s, text-shadow 0.3s;
        }

        .direction-card.selected .card-label {
            color: var(--color-secondary);
            opacity: 1;
            text-shadow: 0 0 12px var(--glow-mid);
        }

        .icon-geo {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
            stroke: var(--color-primary);
            stroke-width: 1.2px;
            fill: none;
        }

        .direction-card.selected .icon-geo {
            stroke: var(--color-secondary);
        }

        .mask-overlay {
            position: absolute;
            inset: 0;
            background: var(--mask-dark);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
            z-index: 2;
        }

        .mask-overlay.on {
            opacity: 1;
            pointer-events: none;
        }

        .stagger-stack {
            width: 85%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            z-index: 3;
        }

        .stagger-stack .direction-card {
            opacity: 0;
            transform: translateY(36px);
        }

        .stagger-stack.run .direction-card:nth-child(1) { animation: cardPop 0.55s cubic-bezier(0.34, 1.35, 0.64, 1) 0ms forwards; }
        .stagger-stack.run .direction-card:nth-child(2) { animation: cardPop 0.55s cubic-bezier(0.34, 1.35, 0.64, 1) 100ms forwards; }
        .stagger-stack.run .direction-card:nth-child(3) { animation: cardPop 0.55s cubic-bezier(0.34, 1.35, 0.64, 1) 200ms forwards; }
        .stagger-stack.run .direction-card:nth-child(4) { animation: cardPop 0.55s cubic-bezier(0.34, 1.35, 0.64, 1) 300ms forwards; }

        @keyframes cardPop {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes cardFall {
            to {
                opacity: 0;
                transform: translateY(120px);
            }
        }

        .fall {
            animation: cardFall 0.55s ease forwards;
        }

        .tarot-card {
            --tarot-w: 86px;
            width: var(--tarot-w);
            height: calc(var(--tarot-w) * 1.6);
            flex-shrink: 0;
            border: 1px solid var(--color-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 6px 4px;
            box-sizing: border-box;
            box-shadow: 0 4px 12px var(--glow-mid);
            transform-style: preserve-3d;
            transition: transform 0.6s ease, opacity 0.5s ease;
            animation: cardBreathe 4s ease-in-out infinite;
            overflow: hidden;
        }

        @keyframes cardBreathe {
            0%, 100% { transform: scale(1) rotateY(0deg); }
            50% { transform: scale(1.02) rotateY(0deg); }
        }

        .tarot-card .name-cn {
            font-size: 16px;
            color: var(--color-primary);
            margin-bottom: 4px;
            font-family: "Noto Serif SC", serif;
        }

        /* 抽牌页卡牌名、象征词见 #page-draw 内样式 */

        .tarot-card .draw-en {
            display: none;
        }

        .tarot-card svg.art {
            width: 46px;
            height: 46px;
            flex-shrink: 0;
            margin: 2px 0;
            stroke: var(--color-primary);
            stroke-width: 1.2px;
            fill: none;
            stroke-linecap: round;
        }

        .reading-mini .tarot-card {
            --tarot-w: 58px;
            width: var(--tarot-w);
            height: calc(var(--tarot-w) * 1.6);
            animation: none;
            transition: border-color 0.5s ease, opacity 0.5s ease, box-shadow 0.5s ease;
        }

        .reading-mini .tarot-card .sym {
            display: none;
        }

        /* ---------- 抽牌页（CardDisplayScreen）三列 grid + 象征词外挂 ---------- */
        #page-draw.page-draw-screen {
            background: #606060;
            color: #D8D0BE;
            font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
            padding-left: 1rem;
            padding-right: 1rem;
        }

        #page-draw .draw-screen-body {
            flex: 1;
            width: 100%;
            max-width: 100%;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: center;
            padding-top: 44px;
        }

        #page-draw .tarot-row.draw-display-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            width: 100%;
            max-width: 100%;
            position: relative;
            top: auto;
            left: auto;
            transform: none;
            align-items: start;
            gap: 0;
        }

        #page-draw .draw-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 0;
            padding: 0 8px;
            box-sizing: border-box;
        }

        #page-draw .tarot-card.draw-stage-card {
            width: 100%;
            max-width: 100%;
            height: 138px;
            min-height: 138px;
            max-height: 138px;
            flex-shrink: 0;
            padding: 6px 4px 8px;
            justify-content: flex-start;
            container-type: size;
        }

        #page-draw .draw-stage-card svg.art {
            width: 46px;
            height: 46px;
            margin: 4px 0 0;
            flex-shrink: 0;
        }

        #page-draw .draw-card-name {
            font-size: 14px;
            color: #D8D0BE;
            text-align: center;
            line-height: 1.2;
            width: 100%;
            max-width: 100%;
            margin-top: auto;
            padding-top: 4px;
            flex-shrink: 0;
            display: block;
            min-height: 0;
            overflow: hidden;
            word-break: keep-all;
            overflow-wrap: anywhere;
        }

        #page-draw .draw-card-name.draw-name-vertical {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            max-height: 86px;
            margin-left: auto;
            margin-right: auto;
            padding-top: 0;
            padding-right: 2px;
            letter-spacing: 0.12em;
        }

        #page-draw .draw-sym-out {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            margin-top: 10px;
            font-size: 12px;
            line-height: 1.45;
            color: #D8D0BE;
            opacity: 0.88;
            text-align: center;
            word-break: break-all;
            overflow-wrap: anywhere;
            flex: 0 1 auto;
        }

        #page-draw #cards-open-btn-wrap.draw-open-btn-wrap {
            position: relative;
            bottom: auto;
            left: auto;
            transform: none;
            margin-top: 40px;
            align-self: center;
            flex-shrink: 0;
        }

        .highlight-name {
            color: #B3A38D;
            font-weight: 700;
        }

        .firefly-text {
            animation: fireflyGlow 4s ease-in-out infinite;
        }

        @keyframes fireflyGlow {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        .firefly-soft {
            animation: fireflySoft 4s ease-in-out infinite;
        }

        @keyframes fireflySoft {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 0.9; }
        }

        .ink-spread {
            animation: inkSpread 1.4s ease-out forwards;
        }

        @keyframes inkSpread {
            from {
                opacity: 0;
                transform: scale(0.92);
                filter: blur(4px);
            }
            to {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }
        }

        .seal-box {
            width: 36px;
            height: 36px;
            border: 1px solid var(--color-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes sealDown {
            0% { transform: translateY(-28px) scale(1.05); opacity: 0; }
            55% { transform: translateY(4px) scale(0.96); opacity: 1; box-shadow: 0 0 28px var(--glow-soft), 0 10px 24px color-mix(in srgb, var(--color-shadow) 35%, transparent); }
            75% { transform: translateY(-2px) scale(1.02); }
            100% { transform: translateY(0) scale(1); opacity: 1; box-shadow: 0 6px 20px color-mix(in srgb, var(--color-shadow) 40%, transparent); }
        }

        .seal-anim {
            animation: sealDown 0.85s ease-out forwards;
        }

        /* 全链路回看：第五–八阶段右上角返回（top/right 16dp，线宽 1.2px，#B3A38D） */
        #page-reading .phase-back-btn,
        #page-archive .phase-back-btn,
        #page-end .phase-back-btn {
            position: absolute !important;
            top: 16px !important;
            right: 16px !important;
            z-index: 50 !important;
            width: 36px !important;
            height: 36px !important;
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
            background: transparent !important;
            color: #B3A38D !important;
            opacity: 0.4 !important;
            cursor: pointer !important;
            pointer-events: auto !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            transition: opacity 0.25s ease !important;
            -webkit-tap-highlight-color: transparent !important;
        }

        #page-reading .phase-back-btn:hover,
        #page-reading .phase-back-btn:active,
        #page-reading .phase-back-btn:focus-visible,
        #page-reading .phase-back-btn.phase-back-lit,
        #page-archive .phase-back-btn:hover,
        #page-archive .phase-back-btn:active,
        #page-archive .phase-back-btn:focus-visible,
        #page-archive .phase-back-btn.phase-back-lit,
        #page-end .phase-back-btn:hover,
        #page-end .phase-back-btn:active,
        #page-end .phase-back-btn:focus-visible,
        #page-end .phase-back-btn.phase-back-lit {
            opacity: 0.9 !important;
        }

        #page-reading .phase-back-btn svg,
        #page-archive .phase-back-btn svg,
        #page-end .phase-back-btn svg {
            display: block !important;
            width: 20px !important;
            height: 20px !important;
        }

        #page-reading .phase-back-btn svg path,
        #page-archive .phase-back-btn svg path,
        #page-end .phase-back-btn svg path {
            stroke: #B3A38D !important;
            stroke-width: 1.2 !important;
            stroke-linecap: round !important;
            stroke-linejoin: round !important;
        }

        .hidden {
            display: none !important;
        }

        .guidance-block {
            width: 300px;
            text-align: center;
            line-height: 2em;
        }

        .guidance-block h2 {
            font-size: 20px;
            font-weight: 400;
            color: var(--color-primary);
            min-height: 1.5em;
        }

        #guidance-body {
            margin-top: 1rem;
        }

        #guidance-btn {
            position: absolute;
            bottom: 20%;
            opacity: 0;
            transform: translateY(0);
        }

        #cards-open-btn-wrap {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 1s ease;
        }

        #cards-open-btn {
            position: relative;
            background: var(--color-secondary);
            color: var(--color-bg);
            border-color: var(--color-secondary);
            overflow: hidden;
        }

        #cards-open-btn:active {
            transform: scale(0.98);
        }

        #cards-open-btn-overlay {
            pointer-events: none;
            position: absolute;
            inset: 0;
            background: color-mix(in srgb, var(--color-primary) 28%, transparent);
            opacity: 0;
            transition: opacity 0.15s ease;
            z-index: 0;
        }

        #cards-open-btn .btn-lbl {
            position: relative;
            z-index: 1;
        }

        #cards-open-btn:active #cards-open-btn-overlay {
            opacity: 1;
        }

        /* 第五阶段：解读页 1:1 像素规范（仅 #page-reading） */
        #page-reading {
            background: #606060 !important;
            color: #D8D0BE !important;
            text-align: center !important;
            overflow: hidden !important;
            padding: 0 !important;
            height: 100vh !important;
            max-height: 100vh !important;
        }

        #page-reading #reading-p3.interpret-panel-read3 {
            padding-top: 0 !important;
            height: 100vh !important;
            max-height: 100vh !important;
            overflow: hidden !important;
        }

        #page-reading .interpret-panel {
            position: absolute !important;
            top: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            max-height: 100% !important;
            padding: 0 !important;
            margin: 0 !important;
            overflow: hidden !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            box-sizing: border-box !important;
        }

        #page-reading .interpret-panel-reading1,
        #page-reading .interpret-panel-reading2 {
            justify-content: flex-start !important;
            padding-top: 48px !important;
        }

        /* 切屏：第二层/第三层淡入，第一层内容收起仅留底部按钮 */
        #page-reading #reading-p2,
        #page-reading #reading-p3 {
            display: flex !important;
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
            transition: opacity 0.6s ease, visibility 0.6s ease !important;
            z-index: 1 !important;
        }

        #page-reading #reading-p2.reading-layer-active,
        #page-reading #reading-p3.reading-layer-active {
            opacity: 1 !important;
            visibility: visible !important;
            pointer-events: auto !important;
            z-index: 5 !important;
        }

        #page-reading #reading-p1 {
            z-index: 2 !important;
        }

        #page-reading #reading-p1.reading-p1-shelled {
            display: flex !important;
            pointer-events: none !important;
            z-index: 30 !important;
        }

        #page-reading #reading-p1.reading-p1-shelled .reading-mini,
        #page-reading #reading-p1.reading-p1-shelled .interpret-text-reading1,

    function playNoiseTransition() {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const dur = 0.5;
            const bufferSize = audioCtx.sampleRate * dur;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.35;
            const src = audioCtx.createBufferSource();
            src.buffer = buffer;
            const gain = audioCtx.createGain();
            const now = audioCtx.currentTime;
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.12, now + 0.08);
            gain.gain.linearRampToValueAtTime(0.12, now + dur * 0.55);
            gain.gain.linearRampToValueAtTime(0, now + dur);
            src.connect(gain);
            gain.connect(audioCtx.destination);
            src.start(now);
            src.stop(now + dur + 0.02);
        } catch (e) { /* ignore */ }
    }

    const TextRevealController = {
        _token: 0,
        abort() { this._token++; },
        get token() { return this._token; }
    };

    /**
     * 通用逐字显现：opacity 0→1 + translateY(5px)→0，统一节奏
     * @param {HTMLElement} el 容器
     * @param {string} text 纯文本（可含 \n → 换行）
     * @param {number} msPerChar 单字间隔 ms
     * @param {object} opts { useSpaceClass, onDone, append }
     */
    function textReveal(el, text, msPerChar, opts) {
        opts = opts || {};
        const myTok = TextRevealController.token;
        const extraClass = opts.extraCharClass ? (' ' + opts.extraCharClass) : '';
        const total = text.length;
        return new Promise(function (resolve) {
            if (!opts.append) el.innerHTML = '';
            let i = 0;
            function step() {
                if (TextRevealController.token !== myTok) return resolve();
                if (i >= text.length) {
                    if (opts.onDone) opts.onDone();
                    return resolve();
                }
                const ch = text[i++];
                if (ch === '\n') {
                    el.appendChild(document.createElement('br'));
                    return void addT(step, msPerChar);
                }
                const span = document.createElement('span');
                span.className = 'reveal-char' + (ch === ' ' && opts.useSpaceClass ? ' space' : '') + extraClass;
                span.textContent = ch;
                el.appendChild(span);
                if (opts.onChar) opts.onChar(i, total);
                addT(step, msPerChar);
            }
            step();
        });
    }

    function goToPageBase(nextId, exitMode) {
        playNoiseTransition();
        clearTimers();
        TextRevealController.abort();

        const cur = document.getElementById(currentId);
        const next = document.getElementById(nextId);
        if (!next || cur === next) {
            next.classList.add('active');
            currentId = nextId;
            onEnter(nextId);
            return;
        }

        cur.classList.remove('active');
        cur.classList.remove('exit-shrink', 'exit-split-l', 'exit-split-r', 'exit-split-both', 'exit-fade');
        if (exitMode === 'split') {
            cur.classList.add('exit-split-l');
        } else if (exitMode === 'fade') {
            cur.classList.add('exit-fade');
        } else {
            cur.classList.add('exit-shrink');
        }

        addT(function () {
            cur.classList.remove('exit-shrink', 'exit-split-l', 'exit-split-r', 'exit-split-both', 'exit-fade');
            next.classList.add('active');
            currentId = nextId;
            onEnter(nextId);
        }, 780);
    }

    function goToPage(nextId, exitMode) {
        if (nextId === 'page-direction' && currentId === 'page-interlude') {

            return { slot: ALIGN_SLOT_NAMES[i] || '', card: c };
        });

            const name = entry && entry.card ? entry.card.name : '';

    function getOrderedSlotCards() {
        return ALIGN_SLOT_NAMES.map(function (slotName) {
            const card = drawnCards.find(function (c) { return c.slot === slotName; });
            return card ? { slot: slotName, card: card } : null;
        }).filter(Boolean);
    }

    function stableHash(s) {
        let h = 5381;
        const str = String(s);
        for (let i = 0; i < str.length; i++) h = ((h << 5) + h) ^ str.charCodeAt(i);
        return h | 0;
    }

    function stablePick(arr, seed) {
        if (!arr.length) return '';
        return arr[Math.abs(stableHash(seed)) % arr.length];
    }

    function getCardSymbols(card) {
        if (!card) return ['内省', '转折', '潜能'];
        if (card.symbol && card.symbol.length) return card.symbol.slice();
        const found = findPoolCard(card.id) || findPoolCard(card.name);
        if (found) return found.symbol.slice();
        return ['内省', '转折', '潜能'];
    }

    function buildTemplateContext(entries) {
        const q = userQuery.trim() || '你此刻的困惑';
        const dir = DIRECTION_FRAMES[selectedDirection] || selectedDirection;
        const ctx = { direction: dir, query: q.length > 24 ? q.slice(0, 24) + '…' : q };
        entries.forEach(function (e) {
            const key = e.slot === '状态' ? 'status' : e.slot === '行动' ? 'action' : 'interference';
            ctx[key] = e.card.name;
            const syms = getCardSymbols(e.card);
            ctx[key + 'Sym'] = syms[0];
            syms.forEach(function (s, i) { ctx['sym' + i] = s; });
        });
        return ctx;
    }

    function buildLocalSessionReading() {
        const entries = getOrderedSlotCards();
        if (entries.length < 3) return null;
        const ctx = buildTemplateContext(entries);
        const symbols = entries.map(function (e) { return getCardSymbols(e.card); });
        return {
            entries: entries,
            cardNames: entries.map(function (e) { return e.card.name; }),
            symbols: symbols,
            read1: entries.map(function (e) {
                const t = stablePick(READ1_TEMPLATES[e.slot] || READ1_TEMPLATES['状态'], e.card.id + e.slot + userQuery);
                const c = Object.assign({}, ctx, { name: e.card.name });
                c.sym0 = getCardSymbols(e.card)[0];
                c.sym1 = getCardSymbols(e.card)[1];
                c.sym2 = getCardSymbols(e.card)[2];
                return fillTemplate(t, c);

            read3Paras: READ3_TEMPLATES.map(function (t) {

    async function fetchChatReply(message) {
        const res = await fetch('https://xuan-livid.vercel.app/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: message })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '请求失败');
        return data.reply;
    }

    function buildInterpretationMessage() {
        const entries = getOrderedSlotCards();
        const cards = entries.map(function (e) {
            const syms = getCardSymbols(e.card).join('、');
            return e.slot + '（id:' + e.card.id + '）：' + e.card.name + ' — 象征：' + syms;
        }).join('\n');
        var insightBlock = '';
        if (aiInsight && aiInsight.length > 0) {
            insightBlock = '\n\n心理聚焦（用户潜意识的深层映照）：\n' + aiInsight;
        }
        return (
            '用户咨询方向：' + selectedDirection + '\n' +
            '用户此刻的困惑：' + userQuery.trim() + '\n' +
            '牌阵编排（状态/行动/干扰）：\n' + cards + insightBlock + '\n\n' +
            '请根据以上信息生成温暖、克制、有留白的中文塔罗解读。' +
            '严格只返回 JSON，不要 markdown 代码块，不要其它说明。字段要求：\n' +
            'read1：长度为3的字符串数组，按状态、行动、干扰顺序，每条100字以内，需提及对应牌名；\n' +
            'read2Body：关联解读一段，200字以内；\n' +
            'read3Paras：4段整体体悟，每段40字以内；\n' +
            'namingLabel：阶段命名，14字以内，无标点；\n' +
            'namingP2a、namingP2b、namingP3：归档引导语；\n' +
            'endTip：与 namingLabel 相同或相近'
        );
    }

    function parseInterpretationReply(reply) {
        try {
            const match = reply.match(/\{[\s\S]*\}/);
            if (!match) return null;
            const parsed = JSON.parse(match[0]);
            if (!Array.isArray(parsed.read1) || parsed.read1.length < 3) return null;
            return parsed;
        } catch (e) {
            return null;
        }
    }

    function mergePackFromReply(parsed, fallback) {
        const label = String(parsed.namingLabel || fallback.namingLabel || '').trim().slice(0, 14);
        return Object.assign({}, fallback, {
            read1: parsed.read1.slice(0, 3),
            read2Body: parsed.read2Body || fallback.read2Body,
            read3Paras: (parsed.read3Paras || fallback.read3Paras).slice(0, 4),
            namingLabel: label,
            namingP2a: parsed.namingP2a || fallback.namingP2a,
            namingP2b: parsed.namingP2b || fallback.namingP2b,
            namingP3: parsed.namingP3 || fallback.namingP3,
            endTip: String(parsed.endTip || parsed.namingLabel || fallback.endTip || '').trim().slice(0, 14)
        });
    }

    async function loadSessionReadingFromAI() {
        clearSessionReading();
        const fallback = buildLocalSessionReading();
        if (!fallback) return null;
        try {
            const reply = await fetchChatReply(buildInterpretationMessage());
            const parsed = parseInterpretationReply(reply);
            if (parsed) {
                sessionReading = mergePackFromReply(parsed, fallback);
                activePack = sessionReading;
                setGlobalConsensusName(sessionReading.namingLabel);
                return sessionReading;
            }
        } catch (e) {
            console.warn('DeepSeek 解读失败，使用本地模板', e);
        }
        sessionReading = fallback;
        activePack = sessionReading;
        return sessionReading;
    }

    /* ---------- 7 抽卡 Page1 ---------- */
    let arcDragState = null;
    let arcSuppressClick = false;

    function layoutArcCards() {
        const track = document.getElementById('draw-arc-track');
        const zone = document.getElementById('draw-arc-zone');
        if (!track || !zone) return;
        const cards = track.querySelectorAll('.arc-card');
        const vw = zone.offsetWidth;
        const radius = vw * 0.50;
        const total = cards.length;
        /* 78 张卡：展角加大到 ~200°，滚动偏移缩放 */
        const spread = Math.PI * 1.1;
        const start = -spread / 2;
        cards.forEach(function (card, i) {
            const t = total <= 1 ? 0.5 : (i + arcScrollOffset) / (total - 1);
            const angle = start + t * spread;
            const x = Math.sin(angle) * radius;
            const y = (1 - Math.cos(angle)) * radius * 0.62;
            const rot = angle * (180 / Math.PI) * 0.12;
            card.style.transform = 'translate(' + x + 'px, ' + y + 'px) rotate(' + rot + 'deg)';
            card.style.zIndex = String(10 + i);
        });
    }

    /* ---------- 抽卡核心：贝塞尔飞牌 + 不重复抽卡 ---------- */

    /** 从牌池中随机抽一张尚未被抽过的卡（不重复） */
    function drawOneFromPool() {
        if (drawPool.length === 0) return null;
        const idx = Math.floor(Math.random() * drawPool.length);
        return drawPool.splice(idx, 1)[0];
    }

    function pickArcCard(arcEl) {
        const zone = document.getElementById('draw-arc-zone');
        const arrangeBtn = document.getElementById('draw-arrange-btn');
        if (!arcEl || !zone || arcEl.classList.contains('picked')) return;
        if (drawPickCount >= 3 || drawPool.length === 0) return;
        if (zone.classList.contains('locked')) return;
        const picked = drawOneFromPool();
        if (!picked) return;
        drawnCards.push({
            id: picked.id,
            name: picked.name,
            symbol: picked.symbol.slice(),
            slot: null,
            isRevealed: false
        });
        const slotIdx = drawPickCount;
        drawPickCount += 1;
        flyArcCardToSlotBezier(arcEl, slotIdx, function () {
            arcEl.classList.add('picked');
            if (drawPickCount >= 3) {
                zone.classList.add('locked');
                if (arrangeBtn) arrangeBtn.classList.add('show');
            }
        });
    }

    /* ---------- 贝塞尔曲线飞牌动画 ---------- */
    function flyArcCardToSlotBezier(fromEl, slotIndex, onDone) {
        const slot = document.getElementById('draw-slot-' + slotIndex);
        if (!slot || !fromEl) return;

        const fromR = fromEl.getBoundingClientRect();
        const toR = slot.getBoundingClientRect();

        /* 创建飞行实体：使用背面卡样式 */
        const fly = createTarotBackEl(drawPickCount);
        fly.className = 'tarot-back draw-fly-card';
        fly.style.position = 'fixed';
        fly.style.left = fromR.left + 'px';
        fly.style.top = fromR.top + 'px';
        fly.style.width = fromR.width + 'px';
        fly.style.height = fromR.height + 'px';
        fly.style.zIndex = '100';
        fly.style.pointerEvents = 'none';
        document.body.appendChild(fly);

        /* 强制回流后开始动画 */
        void fly.offsetWidth;
        void fly.offsetHeight;

        /* 计算控制点：向上形成拱桥弧线 */
        const cx = (fromR.left + toR.left) / 2;
        const cy = Math.min(fromR.top, toR.top) - 80;

        /* 用 Web Animations API 做路径动画 */
        const startX = fromR.left;
        const startY = fromR.top;
        const endX = toR.left;
        const endY = toR.top;

        const frames = 30;
        let frame = 0;
        function animateStep() {
            frame++;
            const t = frame / frames;
            if (t > 1) {
                /* 动画结束：放置卡牌到插槽 */
                slot.innerHTML = '';
                const placed = createTarotBackEl(slotIndex);
                placed.className = 'tarot-back draw-slot-card';
                slot.appendChild(placed);
                slot.classList.remove('draw-slot-base');
                if (fly.parentNode) fly.parentNode.removeChild(fly);
                hapticPulse();
                if (onDone) onDone();
                return;
            }
            /* 二次贝塞尔曲线 B(t) = (1-t)^2*P0 + 2*(1-t)*t*P1 + t^2*P2 */
            const mt = 1 - t;
            const x = mt * mt * startX + 2 * mt * t * cx + t * t * endX;
            const y = mt * mt * startY + 2 * mt * t * cy + t * t * endY;
            fly.style.left = x + 'px';
            fly.style.top = y + 'px';
            /* 轻微旋转动画 */
            const rot = Math.sin(t * Math.PI) * 15;
            fly.style.transform = 'rotate(' + rot + 'deg)';
            requestAnimationFrame(animateStep);
        }
        animateStep();
    }

    /* ---------- 弧形牌阵交互 ---------- */
    function wireDrawArcZone() {
        const zone = document.getElementById('draw-arc-zone');
        if (!zone || zone.dataset.arcWired) return;
        zone.dataset.arcWired = '1';

        /* 根本原因修复：每个 arc-card 独立绑定 click，避免 zone 事件被 drag 吞掉 */
        zone.addEventListener('click', function (e) {
            if (zone.classList.contains('locked')) return;
            if (arcSuppressClick) return;
            if (drawPickCount >= 3) return;
            const arcEl = e.target.closest('.arc-card');
            if (!arcEl || arcEl.classList.contains('picked')) return;
            pickArcCard(arcEl);
        });

        zone.addEventListener('pointerdown', function (e) {
            if (zone.classList.contains('locked')) return;
            if (e.button !== 0 && e.pointerType === 'mouse') return;
            arcDragState = {
                x: e.clientX,
                y: e.clientY,
                offset: arcScrollOffset,
                dragging: false,
                pointerId: e.pointerId
            };
        });

        zone.addEventListener('pointermove', function (e) {
            if (!arcDragState || arcDragState.pointerId !== e.pointerId) return;
            const dx = e.clientX - arcDragState.x;
            if (!arcDragState.dragging) {
                if (Math.abs(dx) < 10) return;
                arcDragState.dragging = true;
                try { zone.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
            }
            arcScrollOffset = arcDragState.offset + dx * 0.06;
            layoutArcCards();
        });

        function endArcDrag(e) {
            if (!arcDragState || (e && arcDragState.pointerId !== e.pointerId)) return;
            if (arcDragState.dragging) {
                try { zone.releasePointerCapture(arcDragState.pointerId); } catch (err) { /* ignore */ }
                arcSuppressClick = true;
                addT(function () { arcSuppressClick = false; }, 320);
            }
            arcDragState = null;
        }

        zone.addEventListener('pointerup', endArcDrag);
        zone.addEventListener('pointercancel', endArcDrag);
    }

    function animateSwapSlots(a, b, onDone) {
        const slotA = document.getElementById('align-slot-' + a);

        const cardB = slotB && slotB.querySelector('.align-slot-card');
        if (!cardA || !cardB) { if (onDone) onDone(); return; }
        const rA = cardA.getBoundingClientRect();
        const rB = cardB.getBoundingClientRect();
        cardA.style.visibility = 'hidden';
        cardB.style.visibility = 'hidden';
        animateAlignFly(rA, rB, a, function () {
            animateAlignFly(rB, rA, b, function () {
                cardA.style.visibility = '';
                cardB.style.visibility = '';
                if (onDone) onDone();
            });
        });
    }

        const poolEl = document.querySelector('.align-pool-card[data-card-index="' + cardIndex + '"]');

        const prevSlot = alignSlotMap.indexOf(cardIndex);
        if (prevSlot >= 0) alignSlotMap[prevSlot] = null;
        if (alignSlotMap[slotIndex] !== null && alignSlotMap[slotIndex] !== cardIndex) {
            if (prevSlot >= 0) alignSlotMap[prevSlot] = alignSlotMap[slotIndex];

        alignSlotMap[slotIndex] = cardIndex;
        syncAlignSlotsToCards();
        alignSelectedIndex = null;

        function finishPlace() {
            renderAlignSlots();
            hapticPulse();

        { x: 64, y: 40 },

    function updateRead3Spotlight(wrapEl, charFracWithinPara, paraIndex) {
        const anchors = READ3_SPOT_ANCHORS;
        const cur = anchors[Math.min(paraIndex, anchors.length - 1)] || anchors[0];
        const prev = anchors[Math.max(0, paraIndex - 1)];
        const next = anchors[Math.min(paraIndex + 1, anchors.length - 1)];
        const t = Math.max(0, Math.min(1, charFracWithinPara));
        let x = cur.x + (next.x - cur.x) * t * 0.38;
        let y = cur.y + (next.y - cur.y) * t * 0.28;
        if (t < 0.22 && paraIndex > 0) {
            const u = t / 0.22;
            x = prev.x * (1 - u) + x * u;
            y = prev.y * (1 - u) + y * u;
        }
        wrapEl.style.setProperty('--read3-spot-x', x + '%');
        wrapEl.style.setProperty('--read3-spot-y', y + '%');
    }

    function tokenizeRead2(str, names) {
        const sorted = (names || []).slice().sort(function (a, b) { return b.length - a.length; });
        const out = [];
        let i = 0;
        while (i < str.length) {
            let matched = null;
            sorted.forEach(function (name) {
                if (!matched && str.startsWith(name, i)) matched = name;
            });
            if (matched) {
                out.push({ t: matched, hl: true });
                i += matched.length;
            } else {
                out.push({ t: str.charAt(i), hl: false });
                i++;
            }
        }
        return out;
    }

    const END_TIMELINE = {
        W: 360,
        H: 100,
        SVG_TOP_PCT: 38,
        SVG_HEIGHT_PCT: 30,
        POINTS: [
            { x: 74,  y: 64 },

    function buildEndTimelineGeometry() {
        const path = document.getElementById('end-sine-path');
        if (!path) return;

        path.setAttribute('d', END_TIMELINE.PATH_D);
        path.style.strokeDasharray = 'none';
        path.style.strokeDashoffset = '0';

        END_TIMELINE.POINTS.forEach(function (pt, idx) {
            const node = document.getElementById('end-node-' + (idx + 1));
            if (!node) return;
            node.style.left = ((pt.x / END_TIMELINE.W) * 100).toFixed(3) + '%';
            node.style.top = (END_TIMELINE.SVG_TOP_PCT + (pt.y / END_TIMELINE.H) * END_TIMELINE.SVG_HEIGHT_PCT).toFixed(3) + '%';
        });

        const drop = document.getElementById('end-drop-light');
        const n3 = document.getElementById('end-node-3');
        if (drop && n3) {
            drop.dataset.landLeft = n3.style.left;
            drop.dataset.landTop = n3.style.top;
        }

    function initReading() {
        if (reviewRestore === 'reading-p3') {
            reviewRestore = null;
            restoreReadingLayer3Complete();
            return;
        }
        ensureSessionReading();
        syncDrawnCardsToReading();
        clearRead3Ambient();
        const rf = document.getElementById('read3-ripple-field');
        const cr = document.getElementById('read3-click-ripples');
        if (rf) rf.innerHTML = '';
        if (cr) cr.innerHTML = '';
        const w3 = document.getElementById('read3-wrap');
        if (w3) {
            w3.classList.remove('read3-exit-fall');
            w3.onclick = null;
            w3.querySelectorAll('.read3-fall-dot').forEach(function (d) { d.remove(); });
        }
        resetReadingNav();
        resetReadingFlipCards('rm-');
        const exploreLbl = document.querySelector('#explore-btn .btn-lbl');
        if (exploreLbl) exploreLbl.textContent = '探寻关联';

        const layer1 = document.getElementById('read1-layer');
        const symLine = document.getElementById('read1-symbols');
        const body1 = document.getElementById('read1-body');
        const panel1 = document.getElementById('read-text-1');
        layer1.innerHTML = '';
        if (symLine) symLine.textContent = '';
        body1.innerHTML = '';
        setRead1NextHint(false);
        let cardIdx = 0;
        let tapHandler = null;
        let waitAdvance = false;
        let revealDone = false;
        const pack = ensureSessionReading();
        const entries = pack ? pack.entries : getOrderedSlotCards();

        function cleanTap() {
            if (tapHandler) {
                panel1.removeEventListener('click', tapHandler);
                tapHandler = null;
            }
            waitAdvance = false;
            revealDone = false;
        }

        function onCardTextReady(idx) {
            revealDone = true;
            waitAdvance = true;
            setRead1NextHint(true);
            /* 文字完整输出后，允许上下滑动 */
            if (body1) body1.classList.add('read1-scrollable');
        }

        function advanceToNextCard(idx) {
            setRead1NextHint(false);
            waitAdvance = false;
            revealDone = false;
            cardIdx = idx + 1;
            runCard();
        }

        function runCard() {
            cleanTap();
            if (!pack || cardIdx >= pack.read1.length) {
                setRead1NextHint(false);
                ['rm-1', 'rm-2', 'rm-3'].forEach(function (id) {
                    const el = document.getElementById(id);
                    if (!el) return;
                    el.classList.remove('reading-card-active', 'reading-card-inactive', 'reading-card-back');
                    el.classList.add('is-flipped', 'reading-card-lit');
                });
                if (readingNavLayer === 1) {
                    showReadingNavBtn(goReadingLayer2, '探寻关联');
                }
                return;
            }
            const entry = entries[cardIdx];
            setMiniHighlight(cardIdx);
            flipReadingCard('rm-', cardIdx + 1);
            drawnCards.forEach(function (c) {
                if (c.id === entry.card.id) c.isRevealed = true;
            });
            body1.innerHTML = '';
            body1.classList.remove('read1-scrollable');
            if (symLine && pack.symbols[cardIdx]) {
                symLine.textContent = pack.symbols[cardIdx].join(' · ');
            }
            layer1.textContent = entry.slot + ' · ' + entry.card.name;
            setRead1NextHint(false);
            const thisIdx = cardIdx;

            tapHandler = function () {
                if (!revealDone) {
                    TextRevealController.abort();
                    body1.textContent = pack.read1[thisIdx];
                    onCardTextReady(thisIdx);
                    return;
                }
                if (waitAdvance) {
                    panel1.removeEventListener('click', tapHandler);
                    tapHandler = null;
                    advanceToNextCard(thisIdx);
                }
            };
            panel1.addEventListener('click', tapHandler);

            textReveal(body1, pack.read1[thisIdx], 150, {}).then(function () {
                if (revealDone) return;
                onCardTextReady(thisIdx);
            });
        }

        layer1.textContent = READ1_TITLE;
        addT(runCard, 400);
    }

    function startPhase2() {
        const navBtn = document.getElementById('explore-btn');
        navBtn.classList.remove('reading-nav-visible');
        navBtn.onclick = null;
        const layer2 = document.getElementById('read2-layer');
        const body2 = document.getElementById('read2-body');
        const panel2 = document.getElementById('read-text-2');
        const cwrap = document.getElementById('reading-p2-cards');
        const pack = ensureSessionReading();
        syncDrawnCardsToReading();
        cwrap.style.transition = 'none';
        cwrap.style.transform = 'scale(1) translateY(0)';
        cwrap.style.opacity = '1';
        void cwrap.offsetWidth;
        cwrap.style.transition = '';
        layer2.innerHTML = '';
        body2.innerHTML = '';
        resetReadingFlipCards('rm2-');
        ['rm2-1', 'rm2-2', 'rm2-3'].forEach(function (id) {
            document.getElementById(id).classList.add('is-flipped', 'reading-card-lit');
        });

        const read2Str = pack.read2Body;
        const cardNames = pack.cardNames;
        const tokens = tokenizeRead2(read2Str, cardNames);
        let ti = 0;
        let timers2 = [];
        let skipped = false;

        function phase2ContentComplete() {
            if (readingNavLayer === 2) {
                showReadingNavBtn(function () {
                    endPhase2Anim();
                }, '体悟整体');
            }
            /* 文字完整输出后，允许上下滑动 */
            if (body2) body2.classList.add('read2-scrollable');
        }

        function flushSkip() {
            skipped = true;
            timers2.forEach(clearTimeout);
            timers2 = [];
            body2.innerHTML = highlightNamesInRead2(read2Str, cardNames);
            highlightRead2Card(3);
            phase2ContentComplete();
        }

        function step() {
            if (skipped || ti >= tokens.length) {
                if (!skipped) highlightRead2Card(3);
                if (!skipped) phase2ContentComplete();
                return;
            }
            const tok = tokens[ti++];
            if (tok.hl) {
                const sp = document.createElement('span');
                sp.className = 'highlight-name';
                sp.textContent = tok.t;
                body2.appendChild(sp);
                const idx = cardNames.indexOf(tok.t);
                if (idx >= 0) highlightRead2Card(idx + 1);
            } else {
                const sp = document.createElement('span');
                sp.className = 'reveal-char';
                sp.textContent = tok.t;
                body2.appendChild(sp);
            }
            const id = setTimeout(step, 150);
            timers2.push(id);
        }

        panel2.onclick = function () { if (!skipped) flushSkip(); };

        function endPhase2Anim() {
            if (readingNavLayer !== 2) return;
            panel2.onclick = null;
            cwrap.style.transition = 'all 1s ease';
            cwrap.style.transform = 'scale(0.8) translateY(-40px)';
            cwrap.style.opacity = '0';
            addT(function () {
                if (readingNavLayer !== 2) return;
                goReadingLayer3();
            }, 900);
        }

        textReveal(layer2, READ2_LAYER, 150, {}).then(function () {
            step();
        });
    }

    function startPhase3() {
        const navBtn = document.getElementById('explore-btn');
        navBtn.classList.remove('reading-nav-visible');
        navBtn.onclick = null;
        const wrap3 = document.getElementById('read3-wrap');
        const spot = document.getElementById('read3-spotlight');

        const clickRipples = document.getElementById('read3-click-ripples');
        let localSkip = false;
        let exitStarted = false;

        clearRead3Ambient();
        read3RippleCounter = 0;
        if (rippleField) rippleField.innerHTML = '';
        if (clickRipples) clickRipples.innerHTML = '';
        wrap3.classList.remove('read3-exit-fall');
        wrap3.querySelectorAll('.read3-fall-dot').forEach(function (d) { d.remove(); });

        t3.innerHTML = '';
        t3.classList.remove('read3-breathe', 'read3-text--full', 'firefly-text');

        flo.classList.remove('ink-spread');

        updateRead3Spotlight(wrap3, 0, 0);
        scheduleRead3AmbientRipples();

        function finishToArchive() {
            wrap3.onclick = null;
            clearRead3Ambient();
            goToPage('page-archive', 'fade');
        }

        function runRead3ExitThen(cb) {
            exitStarted = true;
            wrap3.onclick = null;
            clearRead3Ambient();
            wrap3.classList.add('read3-exit-fall');
            for (let n = 0; n < 52; n++) {
                const d = document.createElement('div');
                d.className = 'read3-fall-dot';
                d.style.left = ((n * 17) % 100) + '%';
                d.style.top = (6 + ((n * 7) % 34)) + '%';
                d.style.animationDuration = (1.08 + (n % 6) * 0.06) + 's';
                d.style.animationDelay = ((n % 7) * 0.02) + 's';
                wrap3.appendChild(d);
            }
            addT(cb, 1280);
        }

        function phase3ContentComplete() {
            if (readingNavLayer === 3) {
                showReadingNavBtn(function () {
                    runRead3ExitThen(finishToArchive);
                }, '生成共识');
            }
        }

        function skipPhase3() {
            if (localSkip) return;
            localSkip = true;
            TextRevealController.abort();
            clearRead3Ambient();
            read3CondenseVisibleChars(t3);
            spot.classList.add('read3-spotlight--expand');
            updateRead3Spotlight(wrap3, 1, activePack.read3Paras.length - 1);
            addT(function () {
                t3.innerHTML = read3FullHighlightedHtml();
                t3.classList.add('read3-breathe', 'read3-text--full');
                flo.classList.add('read3-float-idle');
                phase3ContentComplete();
            }, 220);
        }

        wrap3.onclick = function (e) {
            if (exitStarted || localSkip) return;
            const rect = wrap3.getBoundingClientRect();
            playRead3GoldRipple(clickRipples, e.clientX - rect.left, e.clientY - rect.top);
            read3CondenseVisibleChars(t3);
            skipPhase3();
        };

        function runPara(i) {
            if (localSkip) return;
            if (i >= activePack.read3Paras.length) {
                wrap3.onclick = null;
                t3.classList.add('read3-breathe', 'read3-text--full');
                flo.classList.add('read3-float-idle');
                spot.classList.add('read3-spotlight--expand');
                updateRead3Spotlight(wrap3, 1, activePack.read3Paras.length - 1);
                phase3ContentComplete();
                return;
            }
            const row = document.createElement('div');
            const slots3 = ['st1', 'st2', 'st3', 'st4'];
            row.className = 'read3-para read3-para--' + slots3[Math.min(i, slots3.length - 1)] + ' read3-para--flow';
            t3.appendChild(row);
            const plain = activePack.read3Paras[i];
            textReveal(row, plain, 118, {
                extraCharClass: 'read3-mist-char',
                onChar: function (idx, tot) {
                    if (localSkip) return;
                    updateRead3Spotlight(wrap3, idx / Math.max(tot, 1), i);
                }
            }).then(function () {
                if (localSkip) return;
                updateRead3Spotlight(wrap3, 1, i);
                addT(function () { runPara(i + 1); }, 400);
            });
        }

        addT(function () { runPara(0); }, 400);
    }

    /* ---------- 8 第六阶段情绪承接 + 第七阶段共识命名 ---------- */
    let archivePhase = 'emotional';

    const EMOTIONAL_BRIDGE_S1 = '你所经历的这些，是真实存在的。';
    const EMOTIONAL_BRIDGE_S2 = '它值得被认真对待。';
    const EMOTIONAL_CHAR_MS = 180;
    const EMOTIONAL_PAUSE_MS = 1200;
    const EMOTIONAL_HOLD_MS = 3000;

    function initArchive() {
        if (reviewRestore === 'archive-naming') {
            reviewRestore = null;
            restoreArchiveNamingFull();
            return;
        }
        emotionalBridgeSeq += 1;
        const runId = emotionalBridgeSeq;
        activePack = getActivePack();
        archivePhase = 'emotional';

        const page = document.getElementById('page-archive');
        const scene = document.getElementById('archive-emotional');
        const naming = document.getElementById('archive-naming');
        const et = document.getElementById('archive-emotional-text');

        const bridge = {
            hasNavigated: false,
            isFinished: false,
            exitScheduled: false
        };

        function ok() {
            return runId === emotionalBridgeSeq;
        }

        function detach() {
            et.onclick = null;
            TextRevealController.abort();
        }

        function showFullCopy() {
            et.innerHTML = EMOTIONAL_BRIDGE_S1 + '<br>' + EMOTIONAL_BRIDGE_S2;
            et.classList.add('emotional-bridge-done');
        }

        function onComplete() {
            if (!ok()) return;
            if (bridge.hasNavigated) return;
            bridge.hasNavigated = true;
            detach();
            scene.classList.add('hidden');
            naming.classList.remove('hidden');
            archivePhase = 'naming';
            runNamingSequence();
        }

        function runExit() {
            if (!ok() || bridge.hasNavigated || bridge.exitScheduled) return;
            bridge.exitScheduled = true;
            et.classList.remove('emotional-breathe');
            page.style.transition = 'background-color 1.2s ease';
            page.style.backgroundColor = '#404040';
            et.style.transition = 'opacity 1.2s ease, transform 1.2s ease';
            et.style.opacity = '0';
            et.style.transform = 'scale(0.92)';
            addT(function () {
                if (!ok()) return;
                page.style.backgroundColor = '#606060';
                page.style.transition = '';
                et.style.transition = '';
                et.style.transform = '';
                onComplete();
            }, 1200);
        }

        function afterRevealHold() {
            if (!ok() || bridge.hasNavigated) return;
            et.classList.add('emotional-breathe');
            addT(function () {
                if (!ok() || bridge.hasNavigated) return;
                runExit();
            }, EMOTIONAL_HOLD_MS);
        }

        function onRevealFinished() {
            if (!ok() || bridge.hasNavigated) return;
            bridge.isFinished = true;
            afterRevealHold();
        }

        scene.classList.remove('hidden');
        naming.classList.add('hidden');
        page.style.backgroundColor = '#606060';
        page.style.transition = '';

        et.innerHTML = '';
        et.className = 'emotional-bridge-text';
        et.classList.remove('emotional-breathe', 'emotional-bridge-done', 'firefly-soft');
        et.style.opacity = '';
        et.style.transform = '';
        et.style.transition = '';

        et.onclick = function () {
            if (bridge.hasNavigated) return;
            TextRevealController.abort();
            showFullCopy();
            bridge.isFinished = true;
            if (bridge.exitScheduled) return;
            et.classList.remove('emotional-breathe');
            afterRevealHold();
        };

        addT(function () {
            if (!ok()) return;
            textReveal(et, EMOTIONAL_BRIDGE_S1, EMOTIONAL_CHAR_MS, { extraCharClass: 'emotional-char' }).then(function () {
                if (!ok() || bridge.hasNavigated) return;
                addT(function () {
                    if (!ok() || bridge.hasNavigated) return;
                    textReveal(et, EMOTIONAL_BRIDGE_S2, EMOTIONAL_CHAR_MS, {
                        append: true,
                        extraCharClass: 'emotional-char'
                    }).then(function () {
                        onRevealFinished();
                    });
                }, EMOTIONAL_PAUSE_MS);
            });
        }, 300);
    }

    function namingHaptic() {
        if (navigator.vibrate) navigator.vibrate(40);
    }

    function showNamingNextDock() {
        const dock = document.getElementById('naming-bottom-dock');
        const btn = document.getElementById('naming-next');
        if (!dock || !btn) return;
        dock.classList.remove('naming-step-off');
        dock.classList.add('naming-dock-visible');
        dock.style.opacity = '1';
        btn.style.opacity = '1';
        btn.classList.add('naming-next--show');
    }

    function runNamingSequence() {
        namingSeq += 1;
        const runId = namingSeq;
        const pack = getActivePack();

        function namingOk() {
            return runId === namingSeq;
        }

        function namingTick(fn, ms) {
            addT(function () {
                if (!namingOk()) return;
                fn();
            }, ms);
        }

        const load = document.getElementById('naming-loading');
        const label = document.getElementById('naming-label');
        const sealW = document.getElementById('seal-wrap');
        const seal = document.getElementById('seal-inner');
        const p1 = document.getElementById('naming-p1');
        const p2 = document.getElementById('naming-p2');
        const p3 = document.getElementById('naming-p3');
        const btn = document.getElementById('naming-next');
        const dock = document.getElementById('naming-bottom-dock');
        const guides = document.getElementById('naming-guides');

        TextRevealController.abort();

        p2.innerHTML = '';
        p3.textContent = namingFormat(pack.namingP3);
        p3.classList.remove('naming-footnote-breathe');
        p3.style.opacity = '0';
        p3.style.transition = '';
        guides.classList.add('naming-step-off');
        dock.classList.remove('naming-dock-visible');
        btn.classList.remove('naming-next--show');
        dock.style.opacity = '0';
        dock.style.transition = 'opacity 1s ease';
        btn.style.opacity = '0';

        load.style.display = 'block';
        load.style.opacity = '0.65';
        load.classList.remove('hidden');
        label.textContent = namingFormat(pack.namingLabel);
        label.classList.add('naming-step-off');
        label.style.display = 'block';
        label.style.opacity = '0';
        label.style.transition = 'opacity 1s ease';
        sealW.classList.add('naming-step-off');
        sealW.style.opacity = '0';
        p1.classList.add('naming-step-off');
        p1.style.opacity = '0';
        p2.classList.add('naming-step-off');
        p2.style.opacity = '0';
        seal.classList.remove('seal-anim');
        void seal.offsetWidth;

        /* Step 0：加载态 2s */
        namingTick(function () {
            load.style.display = 'none';
            /* Step 1：命名标签渐显 */
            label.classList.remove('naming-step-off');
            void label.offsetWidth;
            label.style.opacity = '1';
            setGlobalConsensusName(pack.namingLabel);
        }, 2000);

        /* Step 2：印章下压 + 触觉 */
        namingTick(function () {
            sealW.classList.remove('naming-step-off');
            sealW.style.transition = 'opacity 0.5s ease';
            sealW.style.opacity = '1';
            seal.style.opacity = '1';
            seal.classList.add('seal-anim');
            namingHaptic();
        }, 3600);

        /* Step 3a：「此刻的共识已归档。」整体浮现 */
        namingTick(function () {
            guides.classList.remove('naming-step-off');
            p1.classList.remove('naming-step-off');
            p1.style.transition = 'opacity 0.8s ease';
            void p1.offsetWidth;
            p1.style.opacity = '0.8';
        }, 4300);

        /* Step 3b–3c：引导语逐字 + 脚注整体浮现 */
        namingTick(function () {
            p2.classList.remove('naming-step-off');
            p2.style.opacity = '0.8';
            textReveal(p2, namingFormat(pack.namingP2a), 150, {}).then(function () {
                if (!namingOk()) return Promise.resolve();
                return textReveal(p2, namingFormat(pack.namingP2b), 150, { append: true });
            }).then(function () {
                if (!namingOk()) return;
                p3.classList.remove('naming-step-off');
                p3.style.transition = 'opacity 0.9s ease';
                void p3.offsetWidth;
                p3.style.opacity = '0.5';
                p3.classList.add('naming-footnote-breathe');
                /* Step 4：1s 后箭头淡入 */
                namingTick(function () {
                    if (!namingOk()) return;
                    showNamingNextDock();
                }, 1000);
            });
        }, 4700);

        btn.onclick = function () {
            if (!namingOk()) return;
            goToPage('page-end', 'fade');
        };

        /* 兜底：部分手机浏览器会节流逐字动画定时器，导致按钮依赖 Promise 链迟迟不出现。 */
        namingTick(function () {
            if (!namingOk()) return;
            if (!btn.classList.contains('naming-next--show')) showNamingNextDock();
        }, 11000);
    }

    /* ---------- 9 第八阶段结束页（60% 时间轴 / 25% 文案 / 15% 按钮） ---------- */
    function initEnd() {
        endSeq += 1;
        const runId = endSeq;
        const pack = getActivePack();

        function ok() {
            return runId === endSeq;
        }

        buildEndTimelineGeometry();
        resetEndScreenUI();

        const path = document.getElementById('end-sine-path');
        const n1 = document.getElementById('end-node-1');
        const n2 = document.getElementById('end-node-2');
        const drop = document.getElementById('end-drop-light');
        const tipCur = document.getElementById('end-tip-current');
        const copy = document.getElementById('end-copy-text');

        if (tipCur) tipCur.textContent = global_consensus_name || pack.namingLabel || '';
        if (copy) copy.innerHTML = END_SCREEN_COPY.split('\n').join('<br>');

        void path.offsetWidth;
        path.classList.add('end-sine-drawn');

        /* Step 1：曲线延展 + 过去节点依次淡入（间隔 400ms） */
        addT(function () {
            if (!ok()) return;
            n1.classList.add('end-node-visible');
        }, END_ANIM.NODE1_MS);

        addT(function () {
            if (!ok()) return;
            n2.classList.add('end-node-visible');
        }, END_ANIM.NODE2_MS);

        /* Step 2：当前光点自上方降落至波峰 */
        addT(function () {
            if (!ok()) return;
            const landLeft = drop.dataset.landLeft || '82%';
            const landTop = drop.dataset.landTop || '50%';
            drop.style.opacity = '1';
            void drop.offsetWidth;
            drop.style.left = landLeft;
            drop.style.top = landTop;
            drop.classList.add('end-drop-landed');
        }, END_ANIM.DROP_MS);

        /* Step 3：金色提示框 + 价值观文案整体淡入 */
        addT(function () {
            if (!ok()) return;
            endRevealCurrentNode();
            /* Step 4：时间轴/节点/文案全部完成后 1s，底部淡入「结束」闭环按钮 */
            addT(function () {
                if (!ok()) return;
                showEndFinishButton(ok);
            }, END_ANIM.FINISH_DELAY_MS);
        }, END_ANIM.REVEAL_MS);

        /* 兜底：如果移动端浏览器节流了前面的计时器，保证结束页信息和交互点一定出现。 */
        addT(function () {
            if (!ok()) return;
            if (n1) n1.classList.add('end-node-visible');
            if (n2) n2.classList.add('end-node-visible');
            endRevealCurrentNode();
            showEndFinishButton(ok);
        }, END_ANIM.REVEAL_MS + END_ANIM.FINISH_DELAY_MS + 1200);
    }

    window.addEventListener('load', function () {
        wirePhaseBackTouch();
        document.getElementById('reading-back-btn').onclick = phaseBackFromReading;
        document.getElementById('archive-back-btn').onclick = phaseBackFromArchive;
        document.getElementById('end-back-btn').onclick = phaseBackFromEnd;
        var closeBtn = document.getElementById('close-feishu-form');
        if (closeBtn) closeBtn.onclick = closeFeishuForm;
        onEnter('page-welcome');
    });
})();
    </script>
</body>
