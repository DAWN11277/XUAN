<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>观己 · Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+SC:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg: #606060;
            --color-primary: #D8D0BE;
            --color-secondary: #B3A38D;
            --color-shadow: #916F56;
            --color-bg-deep: color-mix(in srgb, var(--color-bg) 72%, black);
            --mask-dark: color-mix(in srgb, black 20%, transparent);
            --label-tint: color-mix(in srgb, var(--color-secondary) 10%, transparent);
            --glow-soft: color-mix(in srgb, var(--color-secondary) 45%, transparent);
            --glow-mid: color-mix(in srgb, var(--color-secondary) 35%, transparent);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background: var(--color-bg);
            font-family: "Noto Serif SC", serif;
            letter-spacing: 0.1em;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .en, .tarot-en {
            font-family: "Cormorant Garamond", "Noto Serif SC", serif;
            letter-spacing: 0.05em;
        }

        .page-container {
            position: relative;
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
            min-height: 100vh;
            height: 100vh;
            max-height: 100vh;
            aspect-ratio: 9 / 19.5;
            background: var(--color-bg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            transition: background-color 1.2s ease, filter 1.2s ease;
        }

        .page-container.draw-dim {
            filter: brightness(0.45);
        }

        .page {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.75s ease, transform 0.75s ease, filter 0.75s ease;
        }

        .page.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .page.overflow-when-needed {
            overflow-y: auto;
        }

        .page.exit-shrink {
            opacity: 0;
            transform: scale(0.88);
            filter: blur(2px);
        }

        .page.exit-split-l {
            opacity: 0;
            transform: translateX(-18%);
        }

        .page.exit-split-r {
            opacity: 0;
            transform: translateX(18%);
        }

        .page.exit-split-both {
            opacity: 0;
            filter: blur(1px);
        }

        .page.exit-split-both .split-half-l {
            transform: translateX(-22%);
            opacity: 0;
            transition: transform 0.75s ease, opacity 0.75s ease;
        }

        .page.exit-split-both .split-half-r {
            transform: translateX(22%);
            opacity: 0;
            transition: transform 0.75s ease, opacity 0.75s ease;
        }

        .page.exit-fade {
            opacity: 0;
        }

        @keyframes smokeIn {
            from { opacity: 0; filter: blur(6px); }
            to { opacity: 1; filter: blur(0); }
        }

        .smoke-in {
            animation: smokeIn 1.5s ease-out forwards;
        }

        @keyframes waterRipple {
            from { opacity: 0; filter: blur(10px); }
            to { opacity: 1; filter: blur(0); }
        }

        .water-ripple {
            animation: waterRipple 1.4s ease-out forwards;
        }

        @keyframes revealChar {
            from {
                opacity: 0;
                transform: translateY(5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .reveal-char {
            display: inline-block;
            opacity: 0;
            animation: revealChar 0.22s ease forwards;
        }

        .reveal-char.space {
            width: 0.35em;
        }

        @keyframes ringBreath {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        .ring-start {
            position: absolute;
            left: 50%;
            bottom: 20%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            border: none;
            background: transparent;
            cursor: pointer;
            padding: 0;
            opacity: 0;
            transition: opacity 1.2s ease;
        }

        .ring-start.visible {
            opacity: 1;
        }

        .ring-outline {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 1.5px solid var(--color-secondary);
            pointer-events: none;
        }

        .ring-glow {
            position: absolute;
            inset: 10px;
            border-radius: 50%;
            background: radial-gradient(circle, color-mix(in srgb, var(--color-secondary) 55%, transparent) 0%, transparent 70%);
            animation: ringBreath 2.8s ease-in-out infinite;
            pointer-events: none;
        }

        .welcome-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            line-height: 2.5;
        }

        .welcome-title {
            font-size: 32px;
            font-weight: 400;
            color: var(--color-primary);
            letter-spacing: 0.2em;
            margin-bottom: 1.5rem;
        }

        .welcome-subtitle {
            font-size: 15px;
            font-weight: 400;
            color: var(--color-primary);
            letter-spacing: 0.18em;
            margin-top: 0.75rem;
        }

        .brand-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
        }

        .brand-title {
            font-size: 42px;
            font-weight: 300;
            color: var(--color-primary);
            letter-spacing: 0.25em;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .brand-title.show {
            opacity: 1;
        }

        .brand-line {
            margin-top: 30px;
            height: 0.5px;
            width: 0;
            max-width: 60px;
            background: var(--color-primary);
            transition: width 0.8s ease;
        }

        .brand-line.extend {
            width: 60px;
        }

        .brand-def {
            margin-top: 28px;
            font-size: 15px;
            color: var(--color-primary);
            letter-spacing: 0.12em;
            text-align: center;
            max-width: 88%;
            opacity: 0;
            transition: opacity 0.9s ease;
        }

        .brand-def.show {
            opacity: 1;
        }

        .brand-footer {
            position: absolute;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 9pt;
            color: var(--color-primary);
            opacity: 0.75;
            letter-spacing: 0.15em;
        }

        .btn-flat {
            min-width: 120px;
            height: 44px;
            border: 1.5px solid var(--color-secondary);
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            color: var(--color-secondary);
            font-family: inherit;
            letter-spacing: 0.1em;
            transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
        }

        .btn-flat:hover {
            box-shadow: 0 2px 10px var(--glow-mid);
        }

        .btn-flat:active {
            border-color: var(--color-primary);
            transform: scale(0.98);
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 28px;
            height: 28px;
            border: none;
            background: transparent;
            cursor: pointer;
            padding: 0;
            z-index: 5;
        }

        .back-btn svg {
            width: 100%;
            height: 100%;
            stroke: var(--color-secondary);
            stroke-width: 1.2px;
            fill: none;
        }

        .direction-card {
            width: 85%;
            padding: 18px 16px;
            border: 1px solid color-mix(in srgb, var(--color-primary) 60%, transparent);
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.3s;
        }

        .direction-card:active {
            transform: scale(0.97);
            border-color: var(--color-secondary);
        }

        .direction-card.selected {
            border-color: var(--color-secondary);
            box-shadow: 0 4px 14px color-mix(in srgb, var(--color-shadow) 45%, transparent);
        }

        .direction-card.selected:not(:active) {
            transform: scale(1.05);
            opacity: 0.95;
        }

        .direction-card .card-label {
            font-size: 20px;
            letter-spacing: 0.15em;
            color: var(--color-primary);
            opacity: 0.6;
            transition: color 0.3s, opacity 0.3s, text-shadow 0.3s;
        }

        .direction-card.selected .card-label {
            color: var(--color-secondary);
            opacity: 1;
            text-shadow: 0 0 12px var(--glow-mid);
        }

        .icon-geo {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
            stroke: var(--color-primary);
            stroke-width: 1.2px;
            fill: none;
        }

        .direction-card.selected .icon-geo {
            stroke: var(--color-secondary);
        }

        .mask-overlay {
            position: absolute;
            inset: 0;
            background: var(--mask-dark);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
            z-index: 2;
        }

        .mask-overlay.on {
            opacity: 1;
            pointer-events: none;
        }

        .stagger-stack {
            width: 85%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            z-index: 3;
        }

        .stagger-stack .direction-card {
            opacity: 0;
            transform: translateY(36px);
        }

        .stagger-stack.run .direction-card:nth-child(1) { animation: cardPop 0.55s cubic-bezier(0.34, 1.35, 0.64, 1) 0ms forwards; }
        .stagger-stack.run .direction-card:nth-child(2) { animation: cardPop 0.55s cubic-bezier(0.34, 1.35, 0.64, 1) 100ms forwards; }
        .stagger-stack.run .direction-card:nth-child(3) { animation: cardPop 0.55s cubic-bezier(0.34, 1.35, 0.64, 1) 200ms forwards; }
        .stagger-stack.run .direction-card:nth-child(4) { animation: cardPop 0.55s cubic-bezier(0.34, 1.35, 0.64, 1) 300ms forwards; }

        @keyframes cardPop {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes cardFall {
            to {
                opacity: 0;
                transform: translateY(120px);
            }
        }

        .fall {
            animation: cardFall 0.55s ease forwards;
        }

        .tarot-card {
            --tarot-w: 86px;
            width: var(--tarot-w);
            height: calc(var(--tarot-w) * 1.6);
            flex-shrink: 0;
            border: 1px solid var(--color-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 6px 4px;
            box-sizing: border-box;
            box-shadow: 0 4px 12px var(--glow-mid);
            transform-style: preserve-3d;
            transition: transform 0.6s ease, opacity 0.5s ease;
            animation: cardBreathe 4s ease-in-out infinite;
            overflow: hidden;
        }

        @keyframes cardBreathe {
            0%, 100% { transform: scale(1) rotateY(0deg); }
            50% { transform: scale(1.02) rotateY(0deg); }
        }

        .tarot-card .name-cn {
            font-size: 16px;
            color: var(--color-primary);
            margin-bottom: 4px;
            font-family: "Noto Serif SC", serif;
        }

        /* 抽牌页卡牌名、象征词见 #page-draw 内样式 */

        .tarot-card .draw-en {
            display: none;
        }

        .tarot-card svg.art {
            width: 46px;
            height: 46px;
            flex-shrink: 0;
            margin: 2px 0;
            stroke: var(--color-primary);
            stroke-width: 1.2px;
            fill: none;
            stroke-linecap: round;
        }

        .reading-mini .tarot-card {
            --tarot-w: 58px;
            width: var(--tarot-w);
            height: calc(var(--tarot-w) * 1.6);
            animation: none;
            transition: border-color 0.5s ease, opacity 0.5s ease, box-shadow 0.5s ease;
        }

        .reading-mini .tarot-card .sym {
            display: none;
        }

        /* ---------- 抽牌页（CardDisplayScreen）三列 grid + 象征词外挂 ---------- */
        #page-draw.page-draw-screen {
            background: #606060;
            color: #D8D0BE;
            font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
            padding-left: 1rem;
            padding-right: 1rem;
        }

        #page-draw .draw-screen-body {
            flex: 1;
            width: 100%;
            max-width: 100%;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: center;
            padding-top: 44px;
        }

        #page-draw .tarot-row.draw-display-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            width: 100%;
            max-width: 100%;
            position: relative;
            top: auto;
            left: auto;
            transform: none;
            align-items: start;
            gap: 0;
        }

        #page-draw .draw-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 0;
            padding: 0 8px;
            box-sizing: border-box;
        }

        #page-draw .tarot-card.draw-stage-card {
            width: 100%;
            max-width: 100%;
            height: 138px;
            min-height: 138px;
            max-height: 138px;
            flex-shrink: 0;
            padding: 6px 4px 8px;
            justify-content: flex-start;
            container-type: size;
        }

        #page-draw .draw-stage-card svg.art {
            width: 46px;
            height: 46px;
            margin: 4px 0 0;
            flex-shrink: 0;
        }

        #page-draw .draw-card-name {
            font-size: 14px;
            color: #D8D0BE;
            text-align: center;
            line-height: 1.2;
            width: 100%;
            max-width: 100%;
            margin-top: auto;
            padding-top: 4px;
            flex-shrink: 0;
            display: block;
            min-height: 0;
            overflow: hidden;
            word-break: keep-all;
            overflow-wrap: anywhere;
        }

        #page-draw .draw-card-name.draw-name-vertical {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            max-height: 86px;
            margin-left: auto;
            margin-right: auto;
            padding-top: 0;
            padding-right: 2px;
            letter-spacing: 0.12em;
        }

        #page-draw .draw-sym-out {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            margin-top: 10px;
            font-size: 12px;
            line-height: 1.45;
            color: #D8D0BE;
            opacity: 0.88;
            text-align: center;
            word-break: break-all;
            overflow-wrap: anywhere;
            flex: 0 1 auto;
        }

        #page-draw #cards-open-btn-wrap.draw-open-btn-wrap {
            position: relative;
            bottom: auto;
            left: auto;
            transform: none;
            margin-top: 40px;
            align-self: center;
            flex-shrink: 0;
        }

        .highlight-name {
            color: #B3A38D;
            font-weight: 700;
        }

        .firefly-text {
            animation: fireflyGlow 4s ease-in-out infinite;
        }

        @keyframes fireflyGlow {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        .firefly-soft {
            animation: fireflySoft 4s ease-in-out infinite;
        }

        @keyframes fireflySoft {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 0.9; }
        }

        .ink-spread {
            animation: inkSpread 1.4s ease-out forwards;
        }

        @keyframes inkSpread {
            from {
                opacity: 0;
                transform: scale(0.92);
                filter: blur(4px);
            }
            to {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }
        }

        .seal-box {
            width: 36px;
            height: 36px;
            border: 1px solid var(--color-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes sealDown {
            0% { transform: translateY(-28px) scale(1.05); opacity: 0; }
            55% { transform: translateY(4px) scale(0.96); opacity: 1; box-shadow: 0 0 28px var(--glow-soft), 0 10px 24px color-mix(in srgb, var(--color-shadow) 35%, transparent); }
            75% { transform: translateY(-2px) scale(1.02); }
            100% { transform: translateY(0) scale(1); opacity: 1; box-shadow: 0 6px 20px color-mix(in srgb, var(--color-shadow) 40%, transparent); }
        }

        .seal-anim {
            animation: sealDown 0.85s ease-out forwards;
        }

        .flow-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 0.5px;
            top: 50%;
            transform: translateY(-50%);
            background: repeating-linear-gradient(90deg, var(--color-secondary) 0 4px, transparent 4px 9px);
            opacity: 0.35;
        }

        .flow-line.lit {
            background: linear-gradient(90deg, var(--color-secondary), color-mix(in srgb, var(--color-secondary) 40%, transparent));
            opacity: 0.75;
        }

        .light-point {
            position: absolute;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: var(--color-primary);
            box-shadow: 0 0 10px var(--color-secondary);
            cursor: pointer;
            transition: left 2.8s cubic-bezier(0.25, 0.8, 0.25, 1), top 1s ease;
        }

        .point-tip {
            position: absolute;
            bottom: 140%;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            font-size: 12px;
            color: var(--color-primary);
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
            padding: 4px 8px;
            border: 1px solid color-mix(in srgb, var(--color-secondary) 50%, transparent);
        }

        .light-point.show-tip .point-tip {
            opacity: 1;
        }

        .hidden {
            display: none !important;
        }

        .guidance-block {
            width: 300px;
            text-align: center;
            line-height: 2em;
        }

        .guidance-block h2 {
            font-size: 20px;
            font-weight: 400;
            color: var(--color-primary);
            min-height: 1.5em;
        }

        #guidance-body {
            margin-top: 1rem;
        }

        #guidance-btn {
            position: absolute;
            bottom: 20%;
            opacity: 0;
            transform: translateY(0);
        }

        #cards-open-btn-wrap {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 1s ease;
        }

        #cards-open-btn {
            position: relative;
            background: var(--color-secondary);
            color: var(--color-bg);
            border-color: var(--color-secondary);
            overflow: hidden;
        }

        #cards-open-btn:active {
            transform: scale(0.98);
        }

        #cards-open-btn-overlay {
            pointer-events: none;
            position: absolute;
            inset: 0;
            background: color-mix(in srgb, var(--color-primary) 28%, transparent);
            opacity: 0;
            transition: opacity 0.15s ease;
            z-index: 0;
        }

        #cards-open-btn .btn-lbl {
            position: relative;
            z-index: 1;
        }

        #cards-open-btn:active #cards-open-btn-overlay {
            opacity: 1;
        }

        #reading-p1 #explore-btn {
            position: relative;
            bottom: auto;
            margin-top: 12px;
            margin-bottom: max(8px, env(safe-area-inset-bottom, 0px));
            flex-shrink: 0;
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .interpret-panel {
            position: absolute;
            inset: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 解读第一屏：上 40% 牌阵，下 60% 文案，禁止滚动 */
        .interpret-panel-reading1 {
            padding: 16px;
            height: 100%;
            max-height: 100%;
            overflow: hidden;
            box-sizing: border-box;
            justify-content: flex-start;
        }

        .interpret-panel-reading1 .reading-mini {
            position: relative;
            top: auto;
            left: auto;
            right: auto;
            flex: 0 0 40%;
            max-height: 40vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .interpret-panel-reading1 .interpret-text-reading1 {
            position: relative;
            top: auto;
            left: auto;
            transform: none;
            flex: 1 1 0;
            min-height: 0;
            width: 85%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            font-size: 16px;
            line-height: 1.8;
            color: var(--color-primary);
            cursor: pointer;
        }

        .interpret-panel-reading1 .read1-body-wrap {
            flex: 1 1 0;
            min-height: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .interpret-panel-reading1 #read1-body {
            width: 100%;
            max-height: 100%;
            overflow: hidden;
            text-align: center;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .interpret-panel-reading1 .read-layer-title {
            flex-shrink: 0;
            margin-bottom: 16px;
            width: 100%;
        }

        .reading-mini {
            position: absolute;
            top: 8%;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .interpret-text {
            position: absolute;
            top: 42%;
            left: 50%;
            transform: translate(-50%, 0);
            width: 88%;
            max-width: 360px;
            min-height: 52vh;
            text-align: center;
            font-size: 16px;
            line-height: 1.8;
            color: var(--color-primary);
            cursor: pointer;
        }

        .interpret-text.phase2 {
            top: 40%;
        }

        /* 解读第二屏：牌阵在上，文案区居中，85% 宽，16px 间距 */
        .interpret-panel-reading2 {
            padding: 16px;
            height: 100%;
            max-height: 100%;
            overflow: hidden;
            box-sizing: border-box;
            justify-content: flex-start;
        }

    <script>
(function () {
    'use strict';

    let currentId = 'page-welcome';
    const timers = [];
    let audioCtx = null;
    let read3AmbientTimer = null;
    let read3RippleCounter = 0;
    let selectedDirection = '情感关系';
    let namingSeq = 0;
    let activePack = null;

    function addT(fn, ms) {
        const id = setTimeout(fn, ms);
        timers.push(id);
        return id;
    }

    function clearTimers() {
        timers.forEach(clearTimeout);
        timers.length = 0;
        read3AmbientTimer = null;
        TextRevealController.abort();
    }

    function playNoiseTransition() {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const dur = 0.5;
            const bufferSize = audioCtx.sampleRate * dur;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.35;
            const src = audioCtx.createBufferSource();
            src.buffer = buffer;
            const gain = audioCtx.createGain();
            const now = audioCtx.currentTime;
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.12, now + 0.08);
            gain.gain.linearRampToValueAtTime(0.12, now + dur * 0.55);
            gain.gain.linearRampToValueAtTime(0, now + dur);
            src.connect(gain);
            gain.connect(audioCtx.destination);
            src.start(now);
            src.stop(now + dur + 0.02);
        } catch (e) { /* ignore */ }
    }

    const TextRevealController = {
        _token: 0,
        abort() { this._token++; },
        get token() { return this._token; }
    };

    /**
     * 通用逐字显现：opacity 0→1 + translateY(5px)→0，统一节奏
     * @param {HTMLElement} el 容器
     * @param {string} text 纯文本（可含 \n → 换行）
     * @param {number} msPerChar 单字间隔 ms
     * @param {object} opts { useSpaceClass, onDone, append }
     */
    function textReveal(el, text, msPerChar, opts) {
        opts = opts || {};
        const myTok = TextRevealController.token;
        const extraClass = opts.extraCharClass ? (' ' + opts.extraCharClass) : '';
        const total = text.length;
        return new Promise(function (resolve) {
            if (!opts.append) el.innerHTML = '';
            let i = 0;
            function step() {
                if (TextRevealController.token !== myTok) return resolve();
                if (i >= text.length) {
                    if (opts.onDone) opts.onDone();
                    return resolve();
                }
                const ch = text[i++];
                if (ch === '\n') {
                    el.appendChild(document.createElement('br'));
                    return void addT(step, msPerChar);
                }
                const span = document.createElement('span');
                span.className = 'reveal-char' + (ch === ' ' && opts.useSpaceClass ? ' space' : '') + extraClass;
                span.textContent = ch;
                el.appendChild(span);
                if (opts.onChar) opts.onChar(i, total);
                addT(step, msPerChar);
            }
            step();
        });
    }

    function goToPageBase(nextId, exitMode) {
        playNoiseTransition();
        clearTimers();
        TextRevealController.abort();

        const cur = document.getElementById(currentId);
        const next = document.getElementById(nextId);
        if (!next || cur === next) {
            next.classList.add('active');
            currentId = nextId;
            onEnter(nextId);
            return;
        }

        cur.classList.remove('active');
        cur.classList.remove('exit-shrink', 'exit-split-l', 'exit-split-r', 'exit-split-both', 'exit-fade');
        if (exitMode === 'split') {
            cur.classList.add('exit-split-l');
        } else if (exitMode === 'fade') {
            cur.classList.add('exit-fade');
        } else {
            cur.classList.add('exit-shrink');
        }

        addT(function () {
            cur.classList.remove('exit-shrink', 'exit-split-l', 'exit-split-r', 'exit-split-both', 'exit-fade');
            next.classList.add('active');
            currentId = nextId;
            onEnter(nextId);
        }, 780);
    }

    function goToPage(nextId, exitMode) {
        if (nextId === 'page-direction' && currentId === 'page-interlude') {
            playNoiseTransition();
            clearTimers();
            TextRevealController.abort();
            const cur = document.getElementById(currentId);
            const next = document.getElementById(nextId);
            cur.classList.remove('active');
            cur.classList.remove('exit-shrink', 'exit-split-l', 'exit-split-r', 'exit-split-both', 'exit-fade');
            cur.classList.add('exit-split-both');
            addT(function () {
                cur.classList.remove('exit-shrink', 'exit-split-l', 'exit-split-r', 'exit-split-both', 'exit-fade');
                next.classList.add('active');
                currentId = nextId;
                onEnter(nextId);
            }, 780);
            return;
        }
        goToPageBase(nextId, exitMode);
    }

    function onEnter(id) {
        switch (id) {
            case 'page-welcome': initWelcome(); break;
            case 'page-brand': initBrand(); break;
            case 'page-emotion': initEmotion(); break;
            case 'page-interlude': initInterlude(); break;
            case 'page-direction': initDirection(); break;
            case 'page-draw': initDraw(); break;
            case 'page-reading': initReading(); break;
            case 'page-archive': initArchive(); break;
            case 'page-end': initEnd(); break;
        }
    }

    /* ---------- 1 欢迎（仅标题「观己」+「看见此刻的自己」，无其它文案） ---------- */
    function initWelcome() {
        const stage = document.getElementById('welcome-stage');
        const btn = document.getElementById('welcome-start');
        btn.classList.remove('visible');

        btn.onclick = function () {
            clearTimers();
            goToPage('page-brand', 'shrink');

        addT(function () {
            btn.classList.add('visible');
        }, 4000);
    }

    /* ---------- 2 品牌 ---------- */
    function initBrand() {
        const t = document.getElementById('brand-title');
        const ln = document.getElementById('brand-line');
        const def = document.getElementById('brand-def');
        t.classList.remove('show');
        ln.classList.remove('extend');
        def.classList.remove('show');
        void t.offsetWidth;
        t.classList.add('show');
        addT(function () { ln.classList.add('extend'); }, 1000);
        addT(function () { def.classList.add('show'); }, 1500);
        addT(function () { goToPage('page-emotion', 'fade'); }, 4500);
    }

    /* ---------- 3 情绪引导 ---------- */
    function initEmotion() {
        const h2 = document.getElementById('emotion-h2');
        const body = document.getElementById('guidance-body');
        const btn = document.getElementById('guidance-btn');
        h2.innerHTML = '';
        body.innerHTML = '';
        btn.style.opacity = '0';
        btn.style.transform = 'translateY(10pt)';
        btn.style.transition = 'opacity 0.85s ease, transform 0.85s ease';

        const g1 = ['让此刻的思绪，', '像水面上的落叶，', '轻轻停一会儿。'];
        const g2 = ['等水面平了，', '你的问题会自己浮现。'];

        function appendLine(sizePx) {
            const p = document.createElement('div');
            p.style.fontSize = sizePx + 'px';
            p.style.color = 'var(--color-primary)';
            body.appendChild(p);
            return p;
        }

        let gi = 0;

        function part1() {
            if (gi >= g1.length) {
                return addT(part1Pause, 1000);
            }
            const p = appendLine(16);
            const txt = g1[gi++];
            textReveal(p, txt, 150, {}).then(function () {
                part1();
            });
        }

        function part1Pause() {
            gi = 0;
            part2();
        }

        function part2() {
            if (gi >= g2.length) {
                addT(function () {
                    btn.style.opacity = '1';
                    btn.style.transform = 'translateY(0)';
                }, 800);
                return;
            }
            const p = appendLine(16);
            const txt = g2[gi++];
            textReveal(p, txt, 150, {}).then(function () {
                part2();
            });
        }

        textReveal(h2, '先不着急。', 150, {}).then(function () {
            gi = 0;
            part1();
        });

        btn.onclick = function () { goToPage('page-interlude', 'shrink'); };
    }

    /* ---------- 4 过场 ---------- */
    function initInterlude() {
        const page = document.getElementById('page-interlude');
        page.classList.remove('exit-split-both');
        const p1 = document.getElementById('interlude-p1');
        const p2 = document.getElementById('interlude-p2');
        const wrap = document.getElementById('interlude-wrap');
        p1.innerHTML = '';
        p2.innerHTML = '';
        wrap.classList.remove('water-ripple');

        wrap.classList.add('water-ripple');
        const s1 = '这里不替你做决定，';
        const s2 = '这里映照你此刻的状态。';
        textReveal(p1, s1, 150, {}).then(function () {
            addT(function () {
                textReveal(p2, s2, 150, {}).then(function () {
                    addT(function () { goToPage('page-direction', 'split'); }, 2200);

    /* ---------- 5 方向 ---------- */

        { name: '宝剑三', title: '牌2：宝剑三（Three of Swords）', sym: '象征：心痛、悲伤、需要被释放的情感' },

            revealCard(0);
        }, 900);
    }

    function getActivePack() {
        return READ_PACKS[selectedDirection] || READ_PACKS['情感关系'];
    }

    /** 命名卡片页：逗号、句号改为换行，便于无标点竖排停顿 */
    function namingFormat(s) {
        if (s == null || s === '') return '';
        return String(s)
            .replace(/[，。、；：]/g, '\n')
            .replace(/,/g, '\n')
            .replace(/\./g, '\n')
            .replace(/\n{3,}/g, '\n\n')
            .trim();
    }

    const READ3_SPOT_ANCHORS = [
        { x: 36, y: 24 },
        { x: 64, y: 40 },
        { x: 34, y: 56 },
        { x: 52, y: 74 }
    ];

    function clearRead3Ambient() {
        if (read3AmbientTimer) {
            clearTimeout(read3AmbientTimer);
            read3AmbientTimer = null;
        }
    }

    function read3EscapeHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function read3ParaToHighlightedHtml(text) {
        let s = read3EscapeHtml(text);
        s = s.replace(/看见/g, '<span class="read3-kw">看见</span>');
        s = s.replace(/希望/g, '<span class="read3-kw">希望</span>');
        s = s.replace(/真实/g, '<span class="read3-kw">真实</span>');
        s = s.replace(/退后一步/g, '<span class="read3-kw">退后一步</span>');
        s = s.replace(/熄灭的光/g, '熄灭的<span class="read3-kw">光</span>');
        return s;
    }

    function read3FullHighlightedHtml() {
        const pack = activePack || getActivePack();
        const paras = pack.read3Paras;
        const slots = ['st1', 'st2', 'st3', 'st4'];
        return paras.map(function (line, idx) {
            const slot = slots[Math.min(idx, slots.length - 1)];
            return '<div class="read3-para read3-para--' + slot + ' read3-para--flow">' + read3ParaToHighlightedHtml(line) + '</div>';
        }).join('');
    }

    function updateRead3Spotlight(wrapEl, charFracWithinPara, paraIndex) {
        const anchors = READ3_SPOT_ANCHORS;
        const cur = anchors[Math.min(paraIndex, anchors.length - 1)] || anchors[0];
        const prev = anchors[Math.max(0, paraIndex - 1)];
        const next = anchors[Math.min(paraIndex + 1, anchors.length - 1)];
        const t = Math.max(0, Math.min(1, charFracWithinPara));
        let x = cur.x + (next.x - cur.x) * t * 0.38;
        let y = cur.y + (next.y - cur.y) * t * 0.28;
        if (t < 0.22 && paraIndex > 0) {
            const u = t / 0.22;
            x = prev.x * (1 - u) + x * u;
            y = prev.y * (1 - u) + y * u;
        }
        wrapEl.style.setProperty('--read3-spot-x', x + '%');
        wrapEl.style.setProperty('--read3-spot-y', y + '%');
    }

    var READ3_RIPPLE_SIZES_PX = [104, 132, 88, 118, 96, 124, 112, 100, 138, 92];
    var READ3_RIPPLE_LEFT_PCT = [24, 58, 41, 72, 16, 50, 66, 33, 12, 44];
    var READ3_RIPPLE_TOP_PCT = [32, 48, 22, 56, 38, 64, 28, 52, 18, 44];

    function spawnRead3BgRipple() {
        const field = document.getElementById('read3-ripple-field');
        if (!field) return;
        read3RippleCounter += 1;
        const i = (read3RippleCounter - 1) % READ3_RIPPLE_SIZES_PX.length;
        const el = document.createElement('div');
        el.className = 'read3-bg-ripple';
        const size = READ3_RIPPLE_SIZES_PX[i];
        el.style.width = size + 'px';
        el.style.height = size + 'px';
        el.style.left = READ3_RIPPLE_LEFT_PCT[i] + '%';
        el.style.top = READ3_RIPPLE_TOP_PCT[i] + '%';
        field.appendChild(el);
        addT(function () {
            if (el.parentNode) el.parentNode.removeChild(el);
        }, 3600);
    }

    function scheduleRead3AmbientRipples() {
        clearRead3Ambient();
        var AMBIENT_MS = 6500;
        function next() {
            read3AmbientTimer = addT(function () {
                spawnRead3BgRipple();
                next();
            }, AMBIENT_MS);
        }
        next();
    }

    function playRead3GoldRipple(layer, x, y) {
        if (!layer) return;
        const ring = document.createElement('div');
        ring.className = 'read3-gold-ripple';
        ring.style.left = x + 'px';
        ring.style.top = y + 'px';
        layer.appendChild(ring);
        addT(function () {
            if (ring.parentNode) ring.parentNode.removeChild(ring);
        }, 1200);
    }

    function read3CondenseVisibleChars(container) {
        const nodes = container.querySelectorAll('.reveal-char.read3-mist-char');
        nodes.forEach(function (sp, i) {
            addT(function () {
                sp.classList.add('read3-char-condensed');
            }, Math.min(i * 3, 420));
        });
    }

    function setMiniHighlight(active) {
        ['rm-1', 'rm-2', 'rm-3'].forEach(function (id, i) {
            const el = document.getElementById(id);
            el.style.transition = 'border-color 0.5s ease, opacity 0.5s ease, box-shadow 0.5s ease';
            if (i === active) {
                el.style.borderColor = '#B3A38D';
                el.style.opacity = '1';
                el.style.boxShadow = '0 4px 14px color-mix(in srgb, #B3A38D 45%, transparent)';
            } else {
                el.style.borderColor = '#D8D0BE';
                el.style.opacity = '0.3';
                el.style.boxShadow = 'none';
            }
        });
    }

        if (rf) rf.innerHTML = '';

        document.getElementById('reading-p1').classList.remove('hidden');
        document.getElementById('reading-p2').classList.add('hidden');
        document.getElementById('reading-p3').classList.add('hidden');
        document.getElementById('explore-btn').style.opacity = '0';
        document.getElementById('explore-btn').onclick = null;

        const layer1 = document.getElementById('read1-layer');
        const body1 = document.getElementById('read1-body');
        const panel1 = document.getElementById('read-text-1');
        const explore = document.getElementById('explore-btn');
        layer1.innerHTML = '';
        body1.innerHTML = '';
        let cardIdx = 0;
        let skipHandler = null;

        function cleanTap() {
            if (skipHandler) {
                panel1.removeEventListener('click', skipHandler);
                skipHandler = null;
            }
        }

        function runCard() {
            cleanTap();
            if (cardIdx >= activePack.read1.length) {
                explore.style.opacity = '1';
                explore.onclick = function () { startPhase2(); };
                return;
            }
            setMiniHighlight(cardIdx);
            body1.innerHTML = '';
            let done = false;
            const thisIdx = cardIdx;
            skipHandler = function () {
                if (done) return;
                done = true;
                panel1.removeEventListener('click', skipHandler);
                skipHandler = null;
                body1.textContent = activePack.read1[thisIdx];
                cardIdx = thisIdx + 1;
                addT(runCard, 500);
            };
            panel1.addEventListener('click', skipHandler);
            textReveal(body1, activePack.read1[thisIdx], 150, {}).then(function () {
                if (done) return;
                done = true;
                panel1.removeEventListener('click', skipHandler);
                skipHandler = null;
                cardIdx = thisIdx + 1;
                addT(runCard, 500);
            });
        }

        textReveal(layer1, READ1_TITLE, 150, {}).then(function () {
            runCard();
        });
    }

    function startPhase2() {
        document.getElementById('reading-p1').classList.add('hidden');
        document.getElementById('reading-p2').classList.remove('hidden');
        const layer2 = document.getElementById('read2-layer');
        const body2 = document.getElementById('read2-body');
        const panel2 = document.getElementById('read-text-2');
        const cwrap = document.getElementById('reading-p2-cards');
        cwrap.style.transition = 'none';
        cwrap.style.transform = 'scale(1) translateY(0)';
        cwrap.style.opacity = '1';
        void cwrap.offsetWidth;
        cwrap.style.transition = '';
        layer2.innerHTML = '';
        body2.innerHTML = '';
        ['rm2-1', 'rm2-2', 'rm2-3'].forEach(function (id) {
            const el = document.getElementById(id);
            el.style.transition = 'border-color 0.5s ease, opacity 0.5s ease, box-shadow 0.5s ease';
            el.style.borderColor = '#D8D0BE';
            el.style.opacity = '0.3';
            el.style.boxShadow = 'none';
        });

        const read2Str = activePack.read2Body;
        const tokens = tokenizeRead2(read2Str);
        let ti = 0;
        let timers2 = [];
        let skipped = false;

        function highlightCard(n) {
            for (let i = 1; i <= 3; i++) {
                const el = document.getElementById('rm2-' + i);
                if (i <= n) {
                    el.style.borderColor = '#B3A38D';
                    el.style.opacity = '1';
                    el.style.boxShadow = '0 4px 14px color-mix(in srgb, #B3A38D 45%, transparent)';
                } else {
                    el.style.borderColor = '#D8D0BE';
                    el.style.opacity = '0.3';
                    el.style.boxShadow = 'none';
                }
            }
        }

        function flushSkip() {
            skipped = true;
            timers2.forEach(clearTimeout);
            timers2 = [];
            body2.innerHTML = read2Str.replace(/隐者|宝剑三|星星/g, function (m) {
                return '<span class="highlight-name">' + m + '</span>';
            });
            highlightCard(3);
            addT(endPhase2Anim, 2000);
        }

        function step() {
            if (skipped || ti >= tokens.length) {
                if (!skipped) highlightCard(3);
                if (!skipped) addT(endPhase2Anim, 2000);
                return;
            }
            const tok = tokens[ti++];
            if (tok.hl) {
                const sp = document.createElement('span');
                sp.className = 'highlight-name';
                sp.textContent = tok.t;
                body2.appendChild(sp);
                if (tok.t === '隐者') highlightCard(1);
                else if (tok.t === '宝剑三') highlightCard(2);
                else if (tok.t === '星星') highlightCard(3);
            } else {
                const sp = document.createElement('span');
                sp.className = 'reveal-char';
                sp.textContent = tok.t;
                body2.appendChild(sp);
            }
            const id = setTimeout(step, 150);
            timers2.push(id);
        }

        panel2.onclick = function () { if (!skipped) flushSkip(); };

        function endPhase2Anim() {
            panel2.onclick = null;
            cwrap.style.transition = 'all 1s ease';
            cwrap.style.transform = 'scale(0.8) translateY(-40px)';
            cwrap.style.opacity = '0';
            addT(function () {
                document.getElementById('reading-p1').classList.add('hidden');
                document.getElementById('reading-p2').classList.add('hidden');
                startPhase3();
            }, 900);
        }

        textReveal(layer2, READ2_LAYER, 150, {}).then(function () {
            step();
        });
    }

    function tokenizeRead2(str) {
        const out = [];
        let i = 0;
        while (i < str.length) {
            if (str.startsWith('宝剑三', i)) {
                out.push({ t: '宝剑三', hl: true });
                i += 3;
            } else if (str.startsWith('隐者', i)) {
                out.push({ t: '隐者', hl: true });
                i += 2;
            } else if (str.startsWith('星星', i)) {
                out.push({ t: '星星', hl: true });
                i += 2;
            } else {
                out.push({ t: str.charAt(i), hl: false });
                i++;
            }
        }
        return out;
    }

    function startPhase3() {
        document.getElementById('reading-p3').classList.remove('hidden');
        const wrap3 = document.getElementById('read3-wrap');
        const spot = document.getElementById('read3-spotlight');
        const flo = document.getElementById('read3-float');
        const t3 = document.getElementById('read-text-3');
        const rippleField = document.getElementById('read3-ripple-field');
        const clickRipples = document.getElementById('read3-click-ripples');
        let localSkip = false;
        let exitStarted = false;

        clearRead3Ambient();
        read3RippleCounter = 0;
        if (rippleField) rippleField.innerHTML = '';
        if (clickRipples) clickRipples.innerHTML = '';
        wrap3.classList.remove('read3-exit-fall');
        wrap3.querySelectorAll('.read3-fall-dot').forEach(function (d) { d.remove(); });

        t3.innerHTML = '';
        t3.classList.remove('read3-breathe', 'read3-text--full', 'firefly-text');
        spot.classList.remove('read3-spotlight--expand');
        flo.classList.remove('read3-float-idle');
        flo.classList.remove('ink-spread');
        void flo.offsetWidth;
        flo.classList.add('ink-spread');

        updateRead3Spotlight(wrap3, 0, 0);
        scheduleRead3AmbientRipples();
        addT(spawnRead3BgRipple, 550);

        function finishToArchive() {
            wrap3.onclick = null;
            clearRead3Ambient();
            goToPage('page-archive', 'fade');
        }

        function runRead3ExitThen(cb) {
            exitStarted = true;
            wrap3.onclick = null;
            clearRead3Ambient();
            wrap3.classList.add('read3-exit-fall');
            for (let n = 0; n < 52; n++) {
                const d = document.createElement('div');
                d.className = 'read3-fall-dot';
                d.style.left = ((n * 17) % 100) + '%';
                d.style.top = (6 + ((n * 7) % 34)) + '%';
                d.style.animationDuration = (1.08 + (n % 6) * 0.06) + 's';
                d.style.animationDelay = ((n % 7) * 0.02) + 's';
                wrap3.appendChild(d);
            }
            addT(cb, 1280);
        }

        function skipPhase3() {
            if (localSkip) return;
            localSkip = true;
            wrap3.onclick = null;
            TextRevealController.abort();
            clearRead3Ambient();
            read3CondenseVisibleChars(t3);
            spot.classList.add('read3-spotlight--expand');
            updateRead3Spotlight(wrap3, 1, activePack.read3Paras.length - 1);
            addT(function () {
                t3.innerHTML = read3FullHighlightedHtml();
                t3.classList.add('read3-breathe', 'read3-text--full');
                flo.classList.add('read3-float-idle');
                addT(function () {
                    runRead3ExitThen(finishToArchive);
                }, 820);
            }, 220);
        }

        wrap3.onclick = function (e) {
            if (exitStarted || localSkip) return;
            const rect = wrap3.getBoundingClientRect();
            playRead3GoldRipple(clickRipples, e.clientX - rect.left, e.clientY - rect.top);
            read3CondenseVisibleChars(t3);
            skipPhase3();
        };

        function runPara(i) {
            if (localSkip) return;
            if (i >= activePack.read3Paras.length) {
                wrap3.onclick = null;
                t3.classList.add('read3-breathe', 'read3-text--full');
                flo.classList.add('read3-float-idle');
                spot.classList.add('read3-spotlight--expand');
                updateRead3Spotlight(wrap3, 1, activePack.read3Paras.length - 1);
                addT(function () {
                    runRead3ExitThen(finishToArchive);
                }, 2200);
                return;
            }
            const row = document.createElement('div');
            const slots3 = ['st1', 'st2', 'st3', 'st4'];
            row.className = 'read3-para read3-para--' + slots3[Math.min(i, slots3.length - 1)] + ' read3-para--flow';
            t3.appendChild(row);
            const plain = activePack.read3Paras[i];
            textReveal(row, plain, 118, {
                extraCharClass: 'read3-mist-char',
                onChar: function (idx, tot) {
                    if (localSkip) return;
                    updateRead3Spotlight(wrap3, idx / Math.max(tot, 1), i);
                }
            }).then(function () {
                if (localSkip) return;
                updateRead3Spotlight(wrap3, 1, i);
                addT(function () { runPara(i + 1); }, 400);
            });
        }

        addT(function () { runPara(0); }, 400);
    }

        et.onclick = function () {
            if (navigated) return;
            navigated = true;
            TextRevealController.abort();
            et.innerHTML = '你所经历的这些<br>是真实存在的<br>它值得被认真对待';
            et.style.opacity = '0.9';
            addT(goNaming, 500);
        };

        addT(function () {
            textReveal(et, p1, 150, {}).then(function () {
                if (navigated) return;
                addT(function () {
                    textReveal(et, p2, 150, { append: true }).then(function () {
                        if (navigated) return;
                        et.classList.add('firefly-soft');
                        addT(function () {
                            if (navigated) return;
                            root.style.backgroundColor = 'var(--color-bg-deep)';
                            et.style.transition = 'opacity 1.2s ease, transform 1.2s ease';
                            et.style.opacity = '0';
                            et.style.transform = 'scale(0.92)';
                            addT(function () {
                                root.style.backgroundColor = 'var(--color-bg)';
                                goNaming();
                            }, 1200);
                        }, 3000);
                    });
                }, 1200);
            });
        }, 300);
    }

    function runNamingSequence() {
        namingSeq += 1;
        const runId = namingSeq;
        const pack = getActivePack();
        function namingOk() {
            return runId === namingSeq;
        }
        function namingTick(fn, ms) {
            addT(function () {
                if (!namingOk()) return;
                fn();
            }, ms);
        }

        const load = document.getElementById('naming-loading');
        const label = document.getElementById('naming-label');
        const sealW = document.getElementById('seal-wrap');
        const seal = document.getElementById('seal-inner');
        const p1 = document.getElementById('naming-p1');
        const p2 = document.getElementById('naming-p2');
        const p3 = document.getElementById('naming-p3');
        const btn = document.getElementById('naming-next');
        const dock = document.getElementById('naming-bottom-dock');

        TextRevealController.abort();

        p2.innerHTML = '';
        p3.innerHTML = '';
        p3.classList.add('hidden');
        dock.classList.remove('naming-dock-visible');
        btn.classList.remove('naming-next--show');
        dock.style.opacity = '';
        dock.style.transition = '';

        load.style.display = 'block';
        load.style.opacity = '0.65';
        load.classList.remove('hidden');
        label.textContent = namingFormat(pack.namingLabel);
        label.classList.add('hidden');
        label.style.opacity = '0';
        sealW.classList.add('hidden');
        p1.classList.add('hidden');
        p2.classList.add('hidden');
        seal.classList.remove('seal-anim');
        void seal.offsetWidth;

        namingTick(function () {
            load.style.display = 'none';
            label.classList.remove('hidden');
            label.style.display = 'block';
            label.style.transition = 'opacity 1s ease';
            void label.offsetWidth;
            label.style.opacity = '1';
        }, 2000);

        namingTick(function () {
            sealW.classList.remove('hidden');
            sealW.style.transition = 'opacity 0.5s ease';
            sealW.style.opacity = '1';
            seal.style.opacity = '1';
            seal.classList.add('seal-anim');
            if (navigator.vibrate) navigator.vibrate(40);
        }, 3600);

        namingTick(function () {
            p1.classList.remove('hidden');
            p1.style.transition = 'opacity 0.6s ease';
            p1.style.opacity = '0.8';
        }, 4300);

        namingTick(function () {
            p2.classList.remove('hidden');
            p2.style.opacity = '0.8';
            textReveal(p2, namingFormat(pack.namingP2a), 150, {}).then(function () {
                if (!namingOk()) return Promise.resolve();
                return textReveal(p2, namingFormat(pack.namingP2b), 150, { append: true });
            }).then(function () {
                if (!namingOk()) return Promise.resolve();
                p3.classList.remove('hidden');
                p3.style.opacity = '0.85';
                return textReveal(p3, namingFormat(pack.namingP3), 150, {});
            }).then(function () {
                if (!namingOk()) return;
                dock.classList.add('naming-dock-visible');
                dock.style.opacity = '0';
                void dock.offsetWidth;
                dock.style.transition = 'opacity 0.55s ease';
                requestAnimationFrame(function () {
                    if (!namingOk()) return;
                    dock.style.opacity = '1';
                    btn.classList.add('naming-next--show');
                });
            });
        }, 4700);

        btn.onclick = function () { goToPage('page-end', 'fade'); };
    }

    /* ---------- 9 结束 ---------- */
    function initEnd() {
        const p1 = document.getElementById('end-p1');
        const p2 = document.getElementById('end-p2');
        const tw = document.getElementById('timeline-wrap');
        const line = document.getElementById('flow-line');
        const pt = document.getElementById('light-point');
        const tip = document.getElementById('point-tip');
        const pack = getActivePack();
        if (tip) tip.textContent = pack.endTip;

        p1.style.opacity = p2.style.opacity = '0';
        p2.style.transform = 'scale(1)';
        tw.style.opacity = '0';
        line.classList.remove('lit');
        pt.style.left = '50%';
        pt.style.top = '20%';
        pt.style.transform = 'translate(-50%, -50%)';
        pt.classList.remove('show-tip');

        addT(function () {
            tw.style.transition = 'opacity 1s ease';
            tw.style.opacity = '1';
        }, 400);

        addT(function () {
            pt.style.transition = 'top 1.1s cubic-bezier(0.4,0,0.2,1), left 2.8s cubic-bezier(0.25,0.75,0.25,1)';
            pt.style.top = '50%';
        }, 900);

        addT(function () {
            line.classList.add('lit');
        }, 2000);

        addT(function () {
            pt.style.left = '28%';
        }, 2400);

        addT(function () {
            p1.style.transition = 'opacity 1.1s ease';
            p1.style.opacity = '1';
        }, 2600);

        addT(function () {
            p2.style.transition = 'opacity 1s ease, transform 1s ease';
            p2.style.opacity = '1';
            p2.style.transform = 'scale(1.03)';
        }, 4100);

        function showTip() { pt.classList.add('show-tip'); }
        function hideTip() { pt.classList.remove('show-tip'); }

        pt.addEventListener('mousedown', showTip);
        pt.addEventListener('mouseup', hideTip);
        pt.addEventListener('mouseleave', hideTip);
        pt.addEventListener('touchstart', function (e) { e.preventDefault(); showTip(); }, { passive: false });
        pt.addEventListener('touchend', hideTip);
    }

    window.addEventListener('load', function () {
        onEnter('page-welcome');
    });
})();
    </script>
</body>
</html>
